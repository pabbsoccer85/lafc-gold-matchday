<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LAFC SoCal 2013/14 Gold · Matchday</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first single column with a fixed bottom tab bar; widens to a 2-col grid of cards at ≥900px with a top nav. Night-match scoreboard: black pitch, gold light, condensed display numerals. */
:root{
  --bg:#0a0a0c; --bg-2:#111115; --surface:#16161b; --surface-2:#1e1e25; --line:#2a2a33; --line-2:#3a3a46;
  --fg:#f5f2ea; --fg-2:#bdb9b0; --muted:#857f74;
  --gold:#c9a45c; --gold-2:#e9cd82; --gold-dim:#8a6f36; --gold-ink:#1a1407;
  --win:#5fd38a; --loss:#ef6f6f; --draw:#c7b57e; --info:#7fb6d9;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --r:18px; --r-s:10px;
  --font-display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
a{color:var(--gold-2)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.display{font-family:var(--font-display);font-weight:400;letter-spacing:.02em;line-height:.95}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* Shell */
.shell{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(180deg,rgba(10,10,12,.98),rgba(10,10,12,.92));backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:50%;background:#000;box-shadow:0 0 0 2px var(--gold-dim)}
.brand b{font-family:var(--font-display);font-size:22px;letter-spacing:.06em;color:var(--gold-2);white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.topnav{display:none;margin-left:auto;gap:4px}
.topnav button{padding:8px 12px;border-radius:999px;color:var(--fg-2);font-weight:600;font-size:14px}
.topnav button[aria-selected="true"]{background:var(--gold);color:var(--gold-ink)}
.live-pill{margin-left:auto;display:none;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.live-pill i{width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 10px var(--win);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:16px;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid-2{display:grid;gap:16px}
@media(min-width:900px){
  .topnav{display:flex}
  .live-pill{margin-left:12px}
  .tabbar{display:none}
  .main{padding-block:24px 48px}
  .grid-2{grid-template-columns:1fr 1fr}
  .grid-2>.span{grid-column:1/-1}
}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(14,14,18,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.02em}
.tabbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--gold-2)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-family:var(--font-display);font-size:22px;letter-spacing:.04em;color:var(--fg)}
.card-h small{color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--gold-dim);color:var(--gold-2);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.chip.solid{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip.win{border-color:rgba(95,211,138,.5);color:var(--win)}
.chip.loss{border-color:rgba(239,111,111,.5);color:var(--loss)}
.muted{color:var(--muted)} .small{font-size:12.5px} .fg2{color:var(--fg-2)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--gold-dim);background:radial-gradient(120% 90% at 85% 10%,rgba(201,164,92,.28),transparent 55%),radial-gradient(80% 70% at 10% 90%,rgba(201,164,92,.10),transparent 60%),linear-gradient(160deg,#17150f,#0b0b0d 60%);padding:22px 18px 18px;box-shadow:var(--shadow)}
.hero .pitch{position:absolute;inset:0;pointer-events:none;opacity:.22;background:
  linear-gradient(90deg,transparent 49.6%,rgba(255,255,255,.5) 49.6%,rgba(255,255,255,.5) 50.4%,transparent 50.4%),
  radial-gradient(circle at 50% 50%,transparent 17%,rgba(255,255,255,.45) 17%,rgba(255,255,255,.45) 17.8%,transparent 17.8%)}
.hero .ghost{position:absolute;right:-30px;bottom:-40px;width:230px;opacity:.07;filter:grayscale(1) brightness(2);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.hero h1{font-family:var(--font-display);font-size:clamp(46px,11vw,84px);line-height:.88;letter-spacing:.01em;margin-top:10px;position:relative}
.hero h1 em{font-style:normal;color:var(--gold-2)}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:18px;position:relative}
.scoreline .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.scoreline .side b{font-family:var(--font-display);font-size:16px;letter-spacing:.1em;color:var(--fg-2)}
.scoreline .big{font-family:var(--font-display);font-size:clamp(64px,18vw,112px);line-height:.85;letter-spacing:.02em;color:var(--fg);white-space:nowrap}
.scoreline .big span{color:var(--gold);padding:0 4px}
.hero-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;position:relative}
.crest{display:inline-grid;place-items:center;border-radius:50%;background:#fff;overflow:hidden;flex:none}
.crest img{width:88%;height:88%;object-fit:contain}
.crest.gold{background:#000;box-shadow:0 0 0 2px var(--gold)}
.crest.sm{width:28px;height:28px} .crest.md{width:40px;height:40px} .crest.lg{width:64px;height:64px} .crest.xl{width:80px;height:80px}

/* Buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;letter-spacing:.02em;border:1px solid transparent;transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);box-shadow:0 6px 18px rgba(201,164,92,.25)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{border-color:var(--line-2);color:var(--fg)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.quiet{color:var(--gold-2);padding:8px 10px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px}
.metric span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.metric strong{display:block;font-family:var(--font-display);font-size:clamp(26px,7vw,36px);white-space:nowrap;line-height:1;margin:4px 0 2px;color:var(--gold-2)}
.metric small{color:var(--fg-2);font-size:12px}

/* Countdown */
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.countdown div{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 4px;text-align:center}
.countdown b{display:block;font-family:var(--font-display);font-size:34px;line-height:1;color:var(--fg)}
.countdown span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.next-match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.next-match b{display:block;font-size:14px;margin-top:6px}
.next-match .vs{font-family:var(--font-display);font-size:26px;color:var(--gold)}

/* Score rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:48px 1fr auto 1fr;align-items:center;gap:8px;padding:10px 6px;border-top:1px solid var(--line);border-radius:10px}
.row:first-child{border-top:0}
.row.ours{background:linear-gradient(90deg,rgba(201,164,92,.12),transparent 60%);border-top-color:transparent}
.row .when{font-size:11px;color:var(--muted);line-height:1.2}
.row .when b{display:block;color:var(--fg-2);font-size:12px}
.team{display:flex;align-items:center;gap:8px;min-width:0;text-align:left}
.team.r{flex-direction:row-reverse;text-align:right}
.team span{font-weight:600;font-size:13.5px;line-height:1.15;min-width:0}
.team small{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--gold);font-weight:800}
.team.tap{cursor:pointer;border-radius:8px;padding:2px}
.team.tap:hover{background:var(--surface-2)}
.score{font-family:var(--font-display);font-size:30px;letter-spacing:.04em;min-width:66px;text-align:center;color:var(--fg)}
.score.vs{font-size:16px;color:var(--muted);letter-spacing:.2em}
.score.pick{color:var(--gold-2)}
.row-note{grid-column:1/-1;font-size:12px;color:var(--fg-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 6px 4px 62px}
.flag{color:var(--draw)}
.date-head{font-family:var(--font-display);font-size:18px;letter-spacing:.08em;color:var(--gold);padding:14px 6px 6px;border-top:1px solid var(--line);margin-top:6px}
.date-head:first-child{border-top:0;margin-top:0;padding-top:4px}
.date-head small{font-family:var(--font-body);font-size:12px;letter-spacing:0;color:var(--muted);margin-left:8px}

/* Form dots */
.form{display:inline-flex;gap:3px}
.form i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#0a0a0c}
.form i.W{background:var(--win)} .form i.L{background:var(--loss)} .form i.D{background:var(--draw)} .form i.x{background:var(--line-2);color:var(--muted)}

/* Table */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.tbl{width:100%;border-collapse:collapse;min-width:640px;font-size:13.5px}
.tbl th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700}
.tbl th:nth-child(1),.tbl th:nth-child(2){text-align:left}
.tbl td{padding:8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td:nth-child(1),.tbl td:nth-child(2){text-align:left}
.tbl tr.ours td{background:linear-gradient(90deg,rgba(201,164,92,.16),rgba(201,164,92,.03))}
.tbl tr.ours td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl td b{font-size:15px}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-weight:800;font-size:12px;color:var(--fg-2);background:var(--surface-2)}
.rank.top{background:var(--gold);color:var(--gold-ink)}
.move{font-weight:700;font-size:12px}
.move.up{color:var(--win)} .move.down{color:var(--loss)} .move.flat{color:var(--muted)}
.compact-tbl td:nth-child(n+6){display:none} .compact-tbl th:nth-child(n+6){display:none}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;flex:1 1 140px;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line-2);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;letter-spacing:0;text-transform:none}
textarea{min-height:90px;resize:vertical}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--fg-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-2);font-family:var(--font-body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Prediction lab */
.picker{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:10px 0}
.picker .side{display:flex;flex-direction:column;align-items:center;gap:8px}
.picker .side b{font-size:13px}
.picker input{width:84px;text-align:center;font-family:var(--font-display);font-size:44px;padding:4px;border-radius:14px;border:1px solid var(--gold-dim);background:var(--bg-2);color:var(--gold-2)}
.picker .colon{font-family:var(--font-display);font-size:40px;color:var(--muted)}
.stepper{display:flex;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);font-weight:800;font-size:18px;color:var(--fg)}
.prob{height:12px;border-radius:999px;overflow:hidden;display:flex;background:var(--bg-2);border:1px solid var(--line)}
.prob i{display:block;height:100%}
.prob i:nth-child(1){background:var(--gold)} .prob i:nth-child(2){background:var(--line-2)} .prob i:nth-child(3){background:var(--info)}
.prob-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2);margin-bottom:6px}
.prob-labels b{color:var(--fg);font-size:14px}
.slider{display:grid;gap:4px;margin-top:14px}
.slider label{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.slider label b{color:var(--gold-2)}
.slider input{width:100%;accent-color:var(--gold)}
.slider div{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.finish{display:flex;align-items:center;gap:14px}
.finish strong{font-family:var(--font-display);font-size:72px;line-height:.9;color:var(--gold-2)}
.finish span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.finish small{display:block;color:var(--fg-2);font-size:12.5px}
.sim-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.sim-summary div{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px;text-align:center}
.sim-summary b{display:block;font-family:var(--font-display);font-size:32px;color:var(--fg);line-height:1}
.sim-summary span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-item{display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;font-size:13px}
.pick-item .score{font-size:22px;min-width:52px}
.quick-picks{display:grid;gap:8px}
.qp{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
.qp .wdl{display:inline-flex;gap:4px}
.qp .wdl button{width:34px;height:30px;border-radius:8px;background:var(--surface-2);font-weight:800;font-size:12px;color:var(--fg-2)}
.qp .wdl button[aria-pressed="true"].W{background:var(--win);color:#06140b}
.qp .wdl button[aria-pressed="true"].D{background:var(--draw);color:#1a1407}
.qp .wdl button[aria-pressed="true"].L{background:var(--loss);color:#1a0606}
.code-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--bg-2);border:1px dashed var(--gold-dim);border-radius:var(--r-s);padding:10px;color:var(--gold-2);user-select:all}

/* Leaderboard */
.lb{display:flex;flex-direction:column;gap:6px}
.lb-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
.lb-row.me{border-color:var(--gold-dim);background:linear-gradient(90deg,rgba(201,164,92,.14),var(--bg-2))}
.lb-row .pts{font-family:var(--font-display);font-size:30px;color:var(--gold-2);line-height:1}
.lb-row .pts small{font-family:var(--font-body);font-size:10px;color:var(--muted);letter-spacing:.1em;display:block;text-align:right}
.lb-row .who b{display:block;font-size:14px}
.lb-row .who small{color:var(--muted);font-size:11.5px}
.lb-row .medal{font-size:20px;text-align:center}

/* Scout */
.scout-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.scout-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.scout-stats div{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px;text-align:center}
.scout-stats b{display:block;font-family:var(--font-display);font-size:28px;line-height:1}
.scout-stats span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.h2h b{display:block;font-family:var(--font-display);font-size:34px;color:var(--gold-2);line-height:1}
.h2h span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.compare{display:grid;gap:8px;margin-top:12px}
.compare-row{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:12px}
.compare-row .bars{display:flex;gap:2px;height:10px}
.compare-row .bars i{display:block;height:100%;border-radius:3px}
.compare-row .bars i:first-child{background:var(--gold);margin-left:auto}

.tc-front>*{position:absolute}

.nc-top{display:flex;align-items:center;gap:6px;padding:8px 9px 0}

/* ---- Team chat bubble ---- */
.chat-fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:0;border:0;background:none;padding:0;cursor:pointer;text-decoration:none;filter:drop-shadow(0 8px 20px rgba(0,0,0,.55))}
.chat-fab-btn{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#0a0a0c;background:linear-gradient(160deg,#fff3c4,#e9cd82 40%,#b8893a);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 0 0 2px rgba(10,10,12,.9);transition:transform .2s}

.nc-back{padding:10px!important}.nc-rows div{padding:2px 0}.nc-rows b{font-size:clamp(16px,8.5cqw,22px)}.nc-back-pos{margin-top:2px}.nc-rows{margin-top:5px}.nc-badge-list{margin-top:5px}.nc-badge-list span{font-size:9px;padding:2px 6px}

.board-side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.board-side b{font-size:12.5px;line-height:1.15}
.board-side .ours-tag{font-size:9px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.board-digits{display:flex;align-items:flex-start;gap:4px}
.digit-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.digit{width:clamp(58px,17vw,84px);height:clamp(72px,21vw,104px);border-radius:14px;border:1px solid rgba(233,205,130,.35);background:linear-gradient(180deg,#1d1a12,#0a0a0c);color:var(--gold-2);font-size:clamp(48px,15vw,76px);line-height:1;display:grid;place-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.06),inset 0 -14px 20px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.5);position:relative;transition:transform .12s}
.digit::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.6)}
.digit:active{transform:scale(.96)}
.digit.pop{animation:digit-pop .3s ease}
@keyframes digit-pop{0%{transform:translateY(-6px) scale(1.06);filter:brightness(1.4)}100%{transform:none;filter:none}}
.digit-minus{width:34px;height:26px;border-radius:8px;background:var(--surface-2);color:var(--fg-2);font-weight:800;font-size:16px;line-height:1}
.board-colon{font-size:clamp(40px,12vw,64px);color:var(--gold-dim);line-height:1;margin-top:8px}
.board-hint{text-align:center;margin:8px 0 10px}
.board-actions{display:flex;gap:8px}
.board-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-top:10px}
.board-meta b{color:var(--gold-2)}
.last-call{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);font-size:13px;color:var(--fg)}
.last-call.exact{border-color:var(--gold)}.last-call.result{border-color:var(--win)}
.last-call .streak{margin-top:4px;color:var(--gold-2);font-weight:700}
details.season-lab{padding:14px 16px}
details.season-lab summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
details.season-lab summary::-webkit-details-marker{display:none}
details.season-lab summary::before{content:"▸";color:var(--gold);font-size:14px}
details.season-lab[open] summary::before{content:"▾"}

.linklike{background:none;border:0;padding:0;color:var(--gold-2);font:inherit;text-decoration:underline;cursor:pointer}

/* practices tab */
.tabbar button{font-size:9.5px;letter-spacing:0}
.practices-hero{background:radial-gradient(120% 80% at 90% 0%,rgba(60,200,120,.18),transparent 55%),linear-gradient(165deg,#11160f,#0c0c0e 70%)}
.pr-next{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pr-date{font-size:34px;line-height:1;color:var(--fg)}
.pr-date small{display:block;font-family:var(--font-body);font-size:13px;color:var(--gold-2);font-weight:700;letter-spacing:.04em;margin-top:4px}
.pr-where a{color:var(--gold-2)}
/* manager sections */
details.mgr-sec{border-top:1px solid var(--line);padding:6px 0}
details.mgr-sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 0}
details.mgr-sec>summary::-webkit-details-marker{display:none}
details.mgr-sec>summary::after{content:"▸";margin-left:auto;color:var(--gold);font-size:14px}
details.mgr-sec[open]>summary::after{content:"▾"}
.mgr-sticky{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(20,18,12,.96);border:1px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:13px;color:var(--fg)}
.mgr-sticky span{flex:1}.mgr-sticky b{color:var(--gold-2)}
@media(min-width:900px){.mgr-sticky{bottom:16px;left:auto;right:24px;width:360px}}
body:has(.mgr-sticky) .chat-fab{bottom:calc(136px + env(safe-area-inset-bottom,0px))}

.kit-line{color:var(--fg-2)}.kit-line b{color:var(--gold-2)}
.kit-next{margin-top:6px;font-size:12.5px;color:var(--fg-2)}.kit-next b{color:var(--gold-2)}

/* ---- Theme toggle + White & Gold theme ---- */
.theme-toggle{margin-left:auto;position:relative;width:48px;height:26px;border-radius:999px;border:1px solid var(--gold-dim);background:var(--bg-2);cursor:pointer;flex-shrink:0;padding:0}
.theme-toggle .tt-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--gold);transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.theme-toggle .tt-ico{position:absolute;top:50%;right:6px;transform:translateY(-50%);font-size:12px;line-height:1}
:root[data-theme="light"] .theme-toggle .tt-knob{transform:translateX(22px)}
:root[data-theme="light"] .theme-toggle .tt-ico{right:auto;left:6px}
.live-pill{margin-left:0}
:root[data-theme="light"]{
  --bg:#faf8f3; --bg-2:#ffffff; --surface:#fffdf8; --surface-2:#f1ece0; --line:#e6dfd0; --line-2:#d3c9b2;
  --fg:#15130e; --fg-2:#3d3628; --muted:#6b6352;
  --gold:#8a6616; --gold-2:#6a4c0a; --gold-dim:#cdb780; --gold-ink:#1a1407;
  --gold-fill:#c9a45c; --gold-fill-2:#e2c678;
  --win:#1f9d55; --loss:#c9403f; --draw:#8a7a45; --info:#2e78a6;
  --shadow:0 12px 30px rgba(80,60,15,.12);
  color-scheme:light;
}
:root[data-theme="light"] body{background:var(--bg);color:var(--fg)}
:root[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(250,248,243,.98),rgba(250,248,243,.92))}
:root[data-theme="light"] .tabbar{background:rgba(255,255,255,.96)}
:root[data-theme="light"] .brand img{background:#fff}
:root[data-theme="light"] .hero{background:radial-gradient(120% 90% at 85% 10%,rgba(180,140,58,.22),transparent 55%),radial-gradient(80% 70% at 10% 90%,rgba(180,140,58,.10),transparent 60%),linear-gradient(160deg,#fffdf6,#f6f0e1 60%)}
:root[data-theme="light"] .hero .pitch{opacity:.12;filter:invert(1)}
:root[data-theme="light"] .practices-hero{background:radial-gradient(120% 80% at 90% 0%,rgba(31,157,85,.14),transparent 55%),linear-gradient(165deg,#fbfdf8,#f4f1e8 70%)}
:root[data-theme="light"] .mgr-sticky{background:rgba(255,253,246,.98);color:var(--fg)}
:root[data-theme="light"] .pcard-face{background:radial-gradient(120% 80% at 90% 0%,rgba(180,140,58,.18),transparent 55%),linear-gradient(165deg,#fffdf6,#f3eee2 70%)}
:root[data-theme="light"] .pcard-face.back,:root[data-theme="light"] .nc-back{background:radial-gradient(120% 80% at 10% 100%,rgba(180,140,58,.16),transparent 55%),linear-gradient(165deg,#fffdf6,#f3eee2 70%)}
:root[data-theme="light"] .coach-pcard,:root[data-theme="light"] .coach-pcard-photo,:root[data-theme="light"] .pcard-photo{background:linear-gradient(180deg,#fff,#f1ece0)}
:root[data-theme="light"] .form i{color:#fff}
:root[data-theme="light"] .chat-fab-btn svg{color:#1a1407}
:root[data-theme="light"] .msg.me{background:linear-gradient(160deg,rgba(180,140,58,.22),rgba(180,140,58,.10))}
:root[data-theme="light"] .name-ask{background:rgba(250,248,243,.8)}
:root[data-theme="light"] .lb-row.me,:root[data-theme="light"] .ours{background:rgba(180,140,58,.10)}
:root[data-theme="light"] .intro{background:#050506} /* the opening sequence stays black & gold */
/* the trading cards and the Call-it scoreboard stay black & gold on purpose: they are the "stadium" pieces of the white theme */
.brand b.brand-long{max-width:calc(100vw - 160px);font-size:clamp(15px,4.6vw,22px)}@media(min-width:900px){.brand b.brand-long{max-width:none}}

/* White & gold: keep fills warm gold while text golds go dark for contrast */
:root[data-theme="light"] .btn.gold{background:linear-gradient(180deg,var(--gold-fill-2),var(--gold-fill));color:var(--gold-ink)}
:root[data-theme="light"] .topnav button[aria-selected="true"],:root[data-theme="light"] .chip.solid,:root[data-theme="light"] .rank.top,:root[data-theme="light"] .seg button[aria-pressed="true"],:root[data-theme="light"] .prob i:nth-child(1),:root[data-theme="light"] .compare-row .bars i:first-child,:root[data-theme="light"] .toast,:root[data-theme="light"] .gb-bar i,:root[data-theme="light"] .theme-toggle .tt-knob{background:var(--gold-fill)}
:root[data-theme="light"] .toast{color:var(--gold-ink)}
:root[data-theme="light"] .tabbar button[aria-selected="true"],:root[data-theme="light"] .brand b{color:var(--gold-2)}
:root[data-theme="light"] .chat-fab-btn{background:linear-gradient(180deg,var(--gold-fill-2),var(--gold-fill))}
:root[data-theme="light"] .chat-fab-ring{border-color:var(--gold-fill)}
:root[data-theme="light"] .nc-num,:root[data-theme="light"] .digit,:root[data-theme="light"] .tc-num{color:var(--gold-fill-2)}
:root[data-theme="light"] .nc-stats b,:root[data-theme="light"] .nc-side,:root[data-theme="light"] .board-side b,:root[data-theme="light"] .board-meta,:root[data-theme="light"] .nc-team,:root[data-theme="light"] .nc-pos,:root[data-theme="light"] .nc-season{color:#e9cd82}
:root[data-theme="light"] .board-side b{color:#f5f2ea}
:root[data-theme="light"] .board-meta b{color:#e9cd82}
:root[data-theme="light"] .nc-front .nc-season,:root[data-theme="light"] .nc-stats small{color:#bdb9b0}
:root[data-theme="light"] .nc-name{color:#f5f2ea}
:root[data-theme="light"] .score.num{color:var(--fg)}
:root[data-theme="light"] .hero .big,:root[data-theme="light"] .scoreline .big{color:var(--fg)}
:root[data-theme="light"] .chart .axis{fill:var(--muted)}
:root[data-theme="light"] .form i{color:#fff}

/* event page */
.ev-row.tap{width:100%;text-align:left;border:0;cursor:pointer;color:inherit;font:inherit;grid-template-columns:52px 1fr 14px}
.ev-row .chev,.row .tap-hint{color:var(--muted);font-size:12px}
.row.tap{cursor:pointer}
.rsvp-sum{display:inline-flex;gap:6px;font-weight:700;font-size:12px}
.rsvp-sum .g{color:var(--win);font-style:normal}.rsvp-sum .m{color:var(--gold-2);font-style:normal}.rsvp-sum .n{color:#e5484d;font-style:normal}
.ev-back{margin-bottom:8px}
.evp-hero{text-align:center;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.evp-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.evp-side{display:flex;flex-direction:column;align-items:center;gap:6px}.evp-side b{font-size:13px}
.evp-mid{display:flex;flex-direction:column;align-items:center}.evp-mid small{font-size:9px;letter-spacing:.14em;color:var(--muted)}
.evp-vs{font-size:34px;color:var(--gold-2)}
.evp-date{font-size:26px;letter-spacing:.04em;margin-top:10px;color:var(--fg)}
.evp-icon{font-size:40px}
.evp-title{font-size:32px;color:var(--fg)}
.evp-rows{display:grid;gap:4px}
.evp-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.evp-row .evp-ic{font-size:20px;width:28px;text-align:center}
.evp-row small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.evp-row div>div{font-size:15px;color:var(--fg);margin-top:2px}
.evp-row b{color:var(--gold-2)}
.evp-maps{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.evp-maps .btn{text-decoration:none}
/* White & gold: heavier, slightly larger type for readability on white */
:root[data-theme="light"] body{font-weight:500;font-size:16px;-webkit-font-smoothing:auto}
:root[data-theme="light"] .small,:root[data-theme="light"] small,:root[data-theme="light"] .row-note{font-size:13.5px}
:root[data-theme="light"] .eyebrow{font-size:12px;font-weight:800}
:root[data-theme="light"] .muted,:root[data-theme="light"] .small.muted{color:#5c5444}
:root[data-theme="light"] .fg2,:root[data-theme="light"] .small.fg2{color:#33301f}
:root[data-theme="light"] .card-h small,:root[data-theme="light"] .date-head small,:root[data-theme="light"] .when,:root[data-theme="light"] .ev-row .when{color:#5c5444;font-weight:700}
:root[data-theme="light"] .tabbar button{font-weight:800;color:#5c5444}
:root[data-theme="light"] .brand small{color:#5c5444;font-weight:700}
:root[data-theme="light"] .btn{font-weight:800}
:root[data-theme="light"] .tbl td,:root[data-theme="light"] .tbl th,:root[data-theme="light"] table.standings td{font-weight:600}
:root[data-theme="light"] a{font-weight:700}

/* ---- Event page v2 ---- */
.evp2{padding:12px 14px 16px}
.evp2-hero{position:relative;border-radius:18px;padding:18px 14px 16px;text-align:center;overflow:hidden;margin-top:6px;border:1px solid var(--gold-dim);background:radial-gradient(120% 90% at 50% 0%,rgba(201,164,92,.30),transparent 60%),linear-gradient(170deg,#17150f,#0b0b0d 70%)}
.evp2-hero.practice{background:radial-gradient(120% 90% at 50% 0%,rgba(60,200,120,.28),transparent 60%),linear-gradient(170deg,#0f1a12,#0b0b0d 70%);border-color:rgba(60,200,120,.4)}
.evp2-hero.event,.evp2-hero.tournament{background:radial-gradient(120% 90% at 50% 0%,rgba(233,205,130,.34),transparent 60%),linear-gradient(170deg,#1a1710,#0b0b0d 70%)}
.evp2-ribbon{display:inline-block;font-family:var(--font-display);font-size:16px;letter-spacing:.14em;color:var(--gold-ink);background:linear-gradient(180deg,var(--gold-2),var(--gold));padding:4px 14px;border-radius:999px;margin-bottom:14px}
.evp2-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.evp2-side{display:flex;flex-direction:column;align-items:center;gap:6px}
.evp2-side .crest.xl{width:84px;height:84px}
.evp2-side b{font-size:15px;line-height:1.1}
.evp2-side small{font-size:9px;letter-spacing:.16em;color:var(--gold);font-weight:800}
.evp2-mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.evp2-vs{font-size:40px;color:var(--gold-2);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--gold-dim);background:rgba(0,0,0,.35);box-shadow:0 0 24px rgba(201,164,92,.25)}
.evp2-score{font-size:44px;color:var(--fg)}
.evp2-mid small{font-size:11px;color:var(--fg-2);font-weight:700}
.evp2-sub{margin-top:14px;font-size:13px;color:var(--fg-2)}
.evp2-icon{font-size:52px;line-height:1;margin:4px 0}
.evp2-title{font-size:40px;color:var(--fg);line-height:1}
.evp2-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 12px;padding:4px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line)}
.evp2-tabs button{padding:11px 10px;border-radius:10px;font-weight:800;font-size:15px;color:var(--fg-2);background:transparent;border:0}
.evp2-tabs button[aria-selected="true"]{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink)}
.evp2-tabs button b{margin-left:4px;font-size:12px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.25)}
.evp2-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evp2-tile{position:relative;padding:14px 12px 12px 14px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line)}
.evp2-tile .ic{position:absolute;right:10px;top:10px;font-size:18px;opacity:.9}
.evp2-tile small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.evp2-tile>div{margin-top:6px;font-size:17px;font-weight:700;color:var(--fg);line-height:1.2}
.evp2-tile>div small{display:block;margin-top:4px;font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--fg-2)}
.kit-swatch{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line-2);vertical-align:-2px;margin-right:6px}
.evp2-maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.evp2-maps .btn{text-decoration:none;padding:11px 6px;font-size:13px}
.evp2-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.evp2-mine{margin-top:14px}
/* availability v2 */
.av-setup{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;background:var(--bg-2);border:1px solid var(--gold-dim);font-size:15px}
.av-me{padding:14px;border-radius:16px;background:linear-gradient(180deg,rgba(201,164,92,.10),transparent),var(--bg-2);border:1px solid var(--gold-dim);margin-bottom:10px}
.av-me-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av-me-head b{font-size:18px;color:var(--fg)}
.av-me-head small{display:block;font-size:12.5px;color:var(--fg-2);margin-top:2px}
.av-num{font-size:30px;color:var(--gold-2);min-width:36px;text-align:center;line-height:1}
.av-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.av-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg-2);font-weight:800;font-size:13px}
.av-btn i{font-style:normal;font-size:22px;line-height:1}
.av-btn.going.on{background:rgba(95,211,138,.18);border-color:var(--win);color:var(--win)}
.av-btn.maybe.on{background:rgba(233,205,130,.18);border-color:var(--gold);color:var(--gold-2)}
.av-btn.no.on{background:rgba(239,111,111,.16);border-color:var(--loss);color:var(--loss)}
.av-summary{margin:14px 0 10px}
.av-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line)}
.av-bar i{display:block;height:100%}.av-bar .going{background:var(--win)}.av-bar .maybe{background:var(--gold)}.av-bar .no{background:var(--loss)}
.av-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--fg-2)}
.av-legend b{font-size:16px;margin-right:2px}
.av-legend .going b{color:var(--win)}.av-legend .maybe b{color:var(--gold-2)}.av-legend .no b{color:var(--loss)}.av-legend .missing b{color:var(--fg)}
.av-group{margin-top:14px}
.av-group-h{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--fg);padding-bottom:6px;border-bottom:1px solid var(--line)}
.av-dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.av-group.going .av-dot{background:var(--win)}.av-group.maybe .av-dot{background:var(--gold)}.av-group.no .av-dot{background:var(--loss)}
.av-count{margin-left:auto;font-weight:800;color:var(--fg-2)}
.av-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.av-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
.av-row .av-num{font-size:24px;min-width:28px}
.av-row b{font-size:15px;color:var(--fg);display:block;line-height:1.1}
.av-row small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.av-empty{padding:10px 0;color:var(--muted);font-size:13.5px}
@media(max-width:360px){.av-list{grid-template-columns:1fr}}

/* ---- Event cards (lists) ---- */
.evc{display:grid;grid-template-columns:56px 1fr 18px;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 10px 12px 12px;margin:0 0 10px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--bg-2),var(--surface));color:inherit;font:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);position:relative;overflow:hidden}
.evc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.evc.practice::before{background:var(--win)}
.evc.event::before,.evc.tournament::before{background:var(--gold-2)}
.evc.past{opacity:.6}
.evc.done::before{background:var(--line-2)}
.evc-date{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.evc-date b{font-size:30px;line-height:1;color:var(--fg)}
.evc-date small{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px;white-space:nowrap}
.evc-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.evc-top{display:flex;align-items:center;gap:10px;min-width:0}
.evc-ico{font-size:26px;width:36px;text-align:center}
.evc-title{min-width:0;flex:1}
.evc-title small{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.evc-title b{display:block;font-size:17px;line-height:1.15;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script type="text/template" id="gold-template"><title>LAFC SoCal 2013/14 Gold · Matchday</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first single column with a fixed bottom tab bar; widens to a 2-col grid of cards at ≥900px with a top nav. Night-match scoreboard: black pitch, gold light, condensed display numerals. */
:root{
  --bg:#0a0a0c; --bg-2:#111115; --surface:#16161b; --surface-2:#1e1e25; --line:#2a2a33; --line-2:#3a3a46;
  --fg:#f5f2ea; --fg-2:#bdb9b0; --muted:#857f74;
  --gold:#c9a45c; --gold-2:#e9cd82; --gold-dim:#8a6f36; --gold-ink:#1a1407;
  --win:#5fd38a; --loss:#ef6f6f; --draw:#c7b57e; --info:#7fb6d9;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --r:18px; --r-s:10px;
  --font-display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
a{color:var(--gold-2)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.display{font-family:var(--font-display);font-weight:400;letter-spacing:.02em;line-height:.95}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* Shell */
.shell{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(180deg,rgba(10,10,12,.98),rgba(10,10,12,.92));backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:50%;background:#000;box-shadow:0 0 0 2px var(--gold-dim)}
.brand b{font-family:var(--font-display);font-size:22px;letter-spacing:.06em;color:var(--gold-2);white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.topnav{display:none;margin-left:auto;gap:4px}
.topnav button{padding:8px 12px;border-radius:999px;color:var(--fg-2);font-weight:600;font-size:14px}
.topnav button[aria-selected="true"]{background:var(--gold);color:var(--gold-ink)}
.live-pill{margin-left:auto;display:none;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.live-pill i{width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 10px var(--win);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:16px;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid-2{display:grid;gap:16px}
@media(min-width:900px){
  .topnav{display:flex}
  .live-pill{margin-left:12px}
  .tabbar{display:none}
  .main{padding-block:24px 48px}
  .grid-2{grid-template-columns:1fr 1fr}
  .grid-2>.span{grid-column:1/-1}
}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(14,14,18,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.02em}
.tabbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--gold-2)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-family:var(--font-display);font-size:22px;letter-spacing:.04em;color:var(--fg)}
.card-h small{color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--gold-dim);color:var(--gold-2);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.chip.solid{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip.win{border-color:rgba(95,211,138,.5);color:var(--win)}
.chip.loss{border-color:rgba(239,111,111,.5);color:var(--loss)}
.muted{color:var(--muted)} .small{font-size:12.5px} .fg2{color:var(--fg-2)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--gold-dim);background:radial-gradient(120% 90% at 85% 10%,rgba(201,164,92,.28),transparent 55%),radial-gradient(80% 70% at 10% 90%,rgba(201,164,92,.10),transparent 60%),linear-gradient(160deg,#17150f,#0b0b0d 60%);padding:22px 18px 18px;box-shadow:var(--shadow)}
.hero .pitch{position:absolute;inset:0;pointer-events:none;opacity:.22;background:
  linear-gradient(90deg,transparent 49.6%,rgba(255,255,255,.5) 49.6%,rgba(255,255,255,.5) 50.4%,transparent 50.4%),
  radial-gradient(circle at 50% 50%,transparent 17%,rgba(255,255,255,.45) 17%,rgba(255,255,255,.45) 17.8%,transparent 17.8%)}
.hero .ghost{position:absolute;right:-30px;bottom:-40px;width:230px;opacity:.07;filter:grayscale(1) brightness(2);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.hero h1{font-family:var(--font-display);font-size:clamp(46px,11vw,84px);line-height:.88;letter-spacing:.01em;margin-top:10px;position:relative}
.hero h1 em{font-style:normal;color:var(--gold-2)}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:18px;position:relative}
.scoreline .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.scoreline .side b{font-family:var(--font-display);font-size:16px;letter-spacing:.1em;color:var(--fg-2)}
.scoreline .big{font-family:var(--font-display);font-size:clamp(64px,18vw,112px);line-height:.85;letter-spacing:.02em;color:var(--fg);white-space:nowrap}
.scoreline .big span{color:var(--gold);padding:0 4px}
.hero-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;position:relative}
.crest{display:inline-grid;place-items:center;border-radius:50%;background:#fff;overflow:hidden;flex:none}
.crest img{width:88%;height:88%;object-fit:contain}
.crest.gold{background:#000;box-shadow:0 0 0 2px var(--gold)}
.crest.sm{width:28px;height:28px} .crest.md{width:40px;height:40px} .crest.lg{width:64px;height:64px} .crest.xl{width:80px;height:80px}

/* Buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;letter-spacing:.02em;border:1px solid transparent;transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);box-shadow:0 6px 18px rgba(201,164,92,.25)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{border-color:var(--line-2);color:var(--fg)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.quiet{color:var(--gold-2);padding:8px 10px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px}
.metric span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.metric strong{display:block;font-family:var(--font-display);font-size:clamp(26px,7vw,36px);white-space:nowrap;line-height:1;margin:4px 0 2px;color:var(--gold-2)}
.metric small{color:var(--fg-2);font-size:12px}

/* Countdown */
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.countdown div{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 4px;text-align:center}
.countdown b{display:block;font-family:var(--font-display);font-size:34px;line-height:1;color:var(--fg)}
.countdown span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.next-match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.next-match b{display:block;font-size:14px;margin-top:6px}
.next-match .vs{font-family:var(--font-display);font-size:26px;color:var(--gold)}

/* Score rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:48px 1fr auto 1fr;align-items:center;gap:8px;padding:10px 6px;border-top:1px solid var(--line);border-radius:10px}
.row:first-child{border-top:0}
.row.ours{background:linear-gradient(90deg,rgba(201,164,92,.12),transparent 60%);border-top-color:transparent}
.row .when{font-size:11px;color:var(--muted);line-height:1.2}
.row .when b{display:block;color:var(--fg-2);font-size:12px}
.team{display:flex;align-items:center;gap:8px;min-width:0;text-align:left}
.team.r{flex-direction:row-reverse;text-align:right}
.team span{font-weight:600;font-size:13.5px;line-height:1.15;min-width:0}
.team small{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--gold);font-weight:800}
.team.tap{cursor:pointer;border-radius:8px;padding:2px}
.team.tap:hover{background:var(--surface-2)}
.score{font-family:var(--font-display);font-size:30px;letter-spacing:.04em;min-width:66px;text-align:center;color:var(--fg)}
.score.vs{font-size:16px;color:var(--muted);letter-spacing:.2em}
.score.pick{color:var(--gold-2)}
.row-note{grid-column:1/-1;font-size:12px;color:var(--fg-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 6px 4px 62px}
.flag{color:var(--draw)}
.date-head{font-family:var(--font-display);font-size:18px;letter-spacing:.08em;color:var(--gold);padding:14px 6px 6px;border-top:1px solid var(--line);margin-top:6px}
.date-head:first-child{border-top:0;margin-top:0;padding-top:4px}
.date-head small{font-family:var(--font-body);font-size:12px;letter-spacing:0;color:var(--muted);margin-left:8px}

/* Form dots */
.form{display:inline-flex;gap:3px}
.form i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#0a0a0c}
.form i.W{background:var(--win)} .form i.L{background:var(--loss)} .form i.D{background:var(--draw)} .form i.x{background:var(--line-2);color:var(--muted)}

/* Table */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.tbl{width:100%;border-collapse:collapse;min-width:640px;font-size:13.5px}
.tbl th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700}
.tbl th:nth-child(1),.tbl th:nth-child(2){text-align:left}
.tbl td{padding:8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td:nth-child(1),.tbl td:nth-child(2){text-align:left}
.tbl tr.ours td{background:linear-gradient(90deg,rgba(201,164,92,.16),rgba(201,164,92,.03))}
.tbl tr.ours td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl td b{font-size:15px}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-weight:800;font-size:12px;color:var(--fg-2);background:var(--surface-2)}
.rank.top{background:var(--gold);color:var(--gold-ink)}
.move{font-weight:700;font-size:12px}
.move.up{color:var(--win)} .move.down{color:var(--loss)} .move.flat{color:var(--muted)}
.compact-tbl td:nth-child(n+6){display:none} .compact-tbl th:nth-child(n+6){display:none}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;flex:1 1 140px;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line-2);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;letter-spacing:0;text-transform:none}
textarea{min-height:90px;resize:vertical}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--fg-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-2);font-family:var(--font-body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Prediction lab */
.picker{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:10px 0}
.picker .side{display:flex;flex-direction:column;align-items:center;gap:8px}
.picker .side b{font-size:13px}
.picker input{width:84px;text-align:center;font-family:var(--font-display);font-size:44px;padding:4px;border-radius:14px;border:1px solid var(--gold-dim);background:var(--bg-2);color:var(--gold-2)}
.picker .colon{font-family:var(--font-display);font-size:40px;color:var(--muted)}
.stepper{display:flex;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);font-weight:800;font-size:18px;color:var(--fg)}
.prob{height:12px;border-radius:999px;overflow:hidden;display:flex;background:var(--bg-2);border:1px solid var(--line)}
.prob i{display:block;height:100%}
.prob i:nth-child(1){background:var(--gold)} .prob i:nth-child(2){background:var(--line-2)} .prob i:nth-child(3){background:var(--info)}
.prob-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2);margin-bottom:6px}
.prob-labels b{color:var(--fg);font-size:14px}
.slider{display:grid;gap:4px;margin-top:14px}
.slider label{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.slider label b{color:var(--gold-2)}
.slider input{width:100%;accent-color:var(--gold)}
.slider div{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.finish{display:flex;align-items:center;gap:14px}
.finish strong{font-family:var(--font-display);font-size:72px;line-height:.9;color:var(--gold-2)}
.finish span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.finish small{display:block;color:var(--fg-2);font-size:12.5px}
.sim-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.sim-summary div{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px;text-align:center}
.sim-summary b{display:block;font-family:var(--font-display);font-size:32px;color:var(--fg);line-height:1}
.sim-summary span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-item{display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;font-size:13px}
.pick-item .score{font-size:22px;min-width:52px}
.quick-picks{display:grid;gap:8px}
.qp{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
.qp .wdl{display:inline-flex;gap:4px}
.qp .wdl button{width:34px;height:30px;border-radius:8px;background:var(--surface-2);font-weight:800;font-size:12px;color:var(--fg-2)}
.qp .wdl button[aria-pressed="true"].W{background:var(--win);color:#06140b}
.qp .wdl button[aria-pressed="true"].D{background:var(--draw);color:#1a1407}
.qp .wdl button[aria-pressed="true"].L{background:var(--loss);color:#1a0606}
.code-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--bg-2);border:1px dashed var(--gold-dim);border-radius:var(--r-s);padding:10px;color:var(--gold-2);user-select:all}

/* Leaderboard */
.lb{display:flex;flex-direction:column;gap:6px}
.lb-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
.lb-row.me{border-color:var(--gold-dim);background:linear-gradient(90deg,rgba(201,164,92,.14),var(--bg-2))}
.lb-row .pts{font-family:var(--font-display);font-size:30px;color:var(--gold-2);line-height:1}
.lb-row .pts small{font-family:var(--font-body);font-size:10px;color:var(--muted);letter-spacing:.1em;display:block;text-align:right}
.lb-row .who b{display:block;font-size:14px}
.lb-row .who small{color:var(--muted);font-size:11.5px}
.lb-row .medal{font-size:20px;text-align:center}

/* Scout */
.scout-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.scout-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.scout-stats div{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px;text-align:center}
.scout-stats b{display:block;font-family:var(--font-display);font-size:28px;line-height:1}
.scout-stats span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.h2h b{display:block;font-family:var(--font-display);font-size:34px;color:var(--gold-2);line-height:1}
.h2h span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.compare{display:grid;gap:8px;margin-top:12px}
.compare-row{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:12px}
.compare-row .bars{display:flex;gap:2px;height:10px}
.compare-row .bars i{display:block;height:100%;border-radius:3px}
.compare-row .bars i:first-child{background:var(--gold);margin-left:auto}
.compare-row .bars i:last-child{background:var(--info)}
.compare-row .bars{position:relative}
.compare-row .bars .l{flex:1;display:flex}
.compare-row .bars .r{flex:1;display:flex}
.compare-row .lbl{text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px;grid-column:1/-1;margin-top:-4px}

/* Fun facts ticker */
.facts{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.facts::-webkit-scrollbar{display:none}
.fact{flex:0 0 min(78vw,300px);scroll-snap-align:start;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:14px}
.fact .eyebrow{color:var(--gold)}
.fact strong{display:block;font-family:var(--font-display);font-size:30px;line-height:1;margin:6px 0 4px}
.fact p{margin:0;font-size:13px;color:var(--fg-2)}

/* Podium */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin:12px 0}
.podium div{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.podium div:nth-child(2){padding-top:18px;border-color:var(--gold-dim)}
.podium b{font-size:12px;line-height:1.15}
.podium strong{font-family:var(--font-display);font-size:30px;color:var(--gold-2);line-height:1}
.podium small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* Confetti & toast */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center;animation:rise .25s ease-out}
@media(min-width:900px){.toast{bottom:28px}}

/* Manager mode */
.mgr-row{display:grid;grid-template-columns:1fr 54px 14px 54px 1fr;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}

.mgr-row .t{display:flex;align-items:center;gap:6px;min-width:0}
.mgr-row .t.r{justify-content:flex-end;text-align:right}
.mgr-row .t span{font-weight:600;font-size:12.5px}
.mgr-meta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.mgr-meta select{width:auto;padding:4px 8px;font-size:12px}
.changed{box-shadow:inset 3px 0 0 var(--gold)}
.banner{background:linear-gradient(90deg,rgba(201,164,92,.18),rgba(201,164,92,.04));border:1px solid var(--gold-dim);border-radius:var(--r-s);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:rgba(239,111,111,.5);background:rgba(239,111,111,.08)}

/* Kids corner — penalty game */
.pitch-game{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:var(--r-s);overflow:hidden;background:#0f2a16;border:1px solid var(--line);touch-action:manipulation}
.pitch-game canvas{width:100%;height:100%;display:block}
.game-hud{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
.game-hud b{font-family:var(--font-display);font-size:28px;color:var(--gold-2)}

/* Share card */
.share-card{width:100%;border-radius:var(--r-s);border:1px solid var(--line);display:block}

.footer{border-top:1px solid var(--line);margin-top:24px;padding:18px 0 8px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.footer b{color:var(--gold-2);font-family:var(--font-display);letter-spacing:.1em;font-size:16px;display:block}
.footer .links{display:flex;gap:14px;flex-wrap:wrap}
details.howto{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-size:13px;color:var(--fg-2)}
details.howto summary{cursor:pointer;font-weight:700;color:var(--fg)}

.empty{padding:20px;text-align:center;color:var(--muted);font-size:13.5px}
.list-tight{display:flex;flex-direction:column;gap:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:0}
.kv b{text-align:right}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(min-width:900px){.tabbar{display:none}}
@media(min-width:620px){.live-pill{display:flex}}
@media(max-width:619px){table.tbl.standings{min-width:0}.tbl.standings th:nth-child(4),.tbl.standings td:nth-child(4),.tbl.standings th:nth-child(5),.tbl.standings td:nth-child(5),.tbl.standings th:nth-child(6),.tbl.standings td:nth-child(6),.tbl.standings th:nth-child(7),.tbl.standings td:nth-child(7),.tbl.standings th:nth-child(8),.tbl.standings td:nth-child(8){display:none}.tbl.standings td,.tbl.standings th{padding:8px 4px}.tbl.standings .team span{font-size:12.5px}}

/* Intro sequence */
.intro{position:fixed;inset:0;z-index:100;background:#050506;overflow:hidden;display:grid;place-items:center;cursor:pointer;animation:intro-out .7s ease-in 6.6s forwards}
.intro .beam{position:absolute;top:-20%;width:38vw;height:160%;background:linear-gradient(180deg,rgba(233,205,130,.0),rgba(233,205,130,.22) 40%,rgba(233,205,130,0));filter:blur(18px);transform-origin:top center;opacity:0}
.intro .beam.l{left:-10%;transform:rotate(-28deg);animation:beam 4.2s ease-in-out .1s forwards}
.intro .beam.r{right:-10%;transform:rotate(28deg);animation:beam 4.2s ease-in-out .5s forwards}
@keyframes beam{0%{opacity:0;transform:rotate(-40deg)}30%{opacity:1}100%{opacity:.35;transform:rotate(-14deg)}}
.intro .beam.r{animation-name:beam-r}
@keyframes beam-r{0%{opacity:0;transform:rotate(40deg)}30%{opacity:1}100%{opacity:.35;transform:rotate(14deg)}}
.intro .ring{position:absolute;width:min(70vw,420px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(201,164,92,.5);opacity:0;animation:ring 2.4s cubic-bezier(.2,.7,.2,1) .5s forwards}
.intro .ring.two{animation-delay:1.1s;border-width:1px}
@keyframes ring{0%{transform:scale(.2);opacity:0}40%{opacity:.9}100%{transform:scale(1.35);opacity:0}}
.intro .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:0 20px}
.intro .crest-wrap{width:min(38vw,170px);aspect-ratio:1;border-radius:50%;background:#000;display:grid;place-items:center;box-shadow:0 0 0 3px var(--gold),0 0 60px rgba(201,164,92,.45);opacity:0;transform:scale(.6) rotate(-12deg);animation:crest-in 1.2s cubic-bezier(.2,.9,.3,1.3) .6s forwards,crest-pulse 2.4s ease-in-out 2.2s infinite}
.intro .crest-wrap img{width:86%;height:86%;object-fit:contain}
@keyframes crest-in{to{opacity:1;transform:none}}
@keyframes crest-pulse{0%,100%{box-shadow:0 0 0 3px var(--gold),0 0 60px rgba(201,164,92,.45)}50%{box-shadow:0 0 0 3px var(--gold-2),0 0 90px rgba(201,164,92,.7)}}
.intro .word{display:flex;gap:.06em;justify-content:center;font-family:var(--font-display);font-size:clamp(56px,16vw,120px);line-height:.9;color:var(--fg);letter-spacing:.02em}

.intro .word.wide.gold{font-size:clamp(40px,12vw,100px)}
.roster-official{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:-6px 0 10px;opacity:.9}

.intro .sub2{font-family:var(--font-display);font-size:clamp(22px,6vw,34px);letter-spacing:.18em;color:var(--fg);opacity:0;animation:fade .8s ease 5.3s forwards}
.intro .line{width:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);animation:line 1.2s ease 3.4s forwards}
@keyframes line{to{width:min(70vw,420px)}}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
.intro .skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:0;animation:fade .5s ease 1.5s forwards}
.intro .dust{position:absolute;inset:0;pointer-events:none}
.intro .dust i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-2);opacity:0;animation:dust 3.2s ease-out infinite}
@keyframes dust{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:.9}100%{opacity:0;transform:translateY(-120px) scale(1.2)}}
@keyframes intro-out{to{opacity:0;transform:translateY(-6%);visibility:hidden}}
.intro.done{animation:intro-out .45s ease-in forwards}
@media (prefers-reduced-motion:reduce){.intro{display:none}}

/* Squad */
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.player{display:grid;grid-template-columns:44px 1fr auto auto;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
.player .num{font-size:30px;color:var(--gold-2);text-align:center;line-height:1}
.player .pn{font-weight:600;font-size:14px;min-width:0;line-height:1.15}
.player .pn small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.player .ga{text-align:center;min-width:28px}.player .ga b{display:block;font-family:var(--font-display);font-size:22px;line-height:1}.player .ga small{font-size:9px;letter-spacing:.12em;color:var(--muted)}
.mgr-player{display:grid;grid-template-columns:56px 1fr 1fr 64px 60px 60px 32px;gap:6px;align-items:center}
.mgr-player label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:700}

.card-h{flex-wrap:wrap}
.h2h b{font-size:clamp(24px,7vw,34px)}

.staff{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gboard{display:flex;flex-direction:column;gap:6px}
.gb-row{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.gb-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-bar{display:flex;gap:2px;height:12px}.gb-bar i{display:block;height:100%;border-radius:3px;background:var(--gold)}.gb-bar i.a{background:var(--info)}
.gb-n{text-align:right;font-weight:700}.gb-n small{color:var(--muted);font-size:9px;margin-right:4px}

.player.lead{border-color:var(--gold-dim);background:linear-gradient(90deg,rgba(201,164,92,.14),var(--bg-2))}
.row-note.scorers{font-size:12px;color:var(--gold-2);padding-top:0}
.report{margin-top:14px}
.rep-list{display:flex;flex-direction:column;gap:4px}
.rep-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line)}
.rep-row.on{border-color:var(--gold-dim)}
.rep-ctl{display:inline-flex;align-items:center;gap:4px}
.rep-ctl small{font-size:9px;letter-spacing:.1em;color:var(--muted);margin-right:2px}
.rep-ctl button{width:28px;height:28px;border-radius:8px;background:var(--surface-2);font-weight:800;color:var(--fg)}

@media(max-width:420px){.rep-row .pn{font-size:12.5px}.rep-ctl button{width:26px;height:26px}}

.tbl td:last-child{min-width:72px}
@media(max-width:619px){.tbl.standings td:last-child{min-width:64px}}
.form{flex-wrap:nowrap;white-space:nowrap}
@media(max-width:619px){.tbl.standings td:nth-child(2){white-space:normal;min-width:120px}.tbl.standings td:nth-child(2) .team span{line-height:1.1}.tbl.standings{table-layout:auto}}
@media(max-width:619px){.tbl.standings .form i{width:13px;height:13px;font-size:8px;border-radius:3px}.tbl.standings .form{gap:2px}.tbl.standings td,.tbl.standings th{padding:8px 3px}.tbl.standings td:nth-child(2){min-width:104px}}
@media(max-width:619px){.tbl.standings th:nth-child(9),.tbl.standings td:nth-child(9){display:none}.tbl.standings td:last-child{min-width:94px;text-align:right}.tbl.standings td:nth-child(2){min-width:96px}}

.intro .sound-btn{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:10px 18px;border-radius:999px;border:1px solid var(--gold-dim);color:var(--gold-2);font-weight:700;font-size:13px;letter-spacing:.06em;background:rgba(201,164,92,.1);opacity:0;animation:fade .5s ease .9s forwards,sound-pulse 1.8s ease-in-out 1.4s infinite}
.intro .sound-btn.on{animation:fade .3s ease forwards;background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
@keyframes sound-pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,164,92,.35)}50%{box-shadow:0 0 0 10px rgba(201,164,92,0)}}
.intro .skip{cursor:pointer;padding:8px 10px}

/* Player trading cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.cards{grid-template-columns:repeat(4,1fr)}}
.pcard{perspective:1000px;text-align:left;padding:0;border-radius:16px;min-height:210px;display:block;width:100%}
.pcard-in{position:relative;width:100%;height:100%;min-height:210px;transition:transform .55s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.pcard.flipped .pcard-in{transform:rotateY(180deg)}
.pcard-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--gold-dim);background:radial-gradient(120% 80% at 90% 0%,rgba(201,164,92,.35),transparent 55%),linear-gradient(165deg,#1b180f,#0c0c0e 70%);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(233,205,130,.08)}
.pcard-face.back{transform:rotateY(180deg);background:radial-gradient(120% 80% at 10% 100%,rgba(201,164,92,.25),transparent 55%),linear-gradient(165deg,#15140f,#0c0c0e 70%)}
.pcard.lead .pcard-face.front{border-color:var(--gold);box-shadow:0 10px 30px rgba(201,164,92,.25)}
.pcard-top{display:flex;justify-content:space-between;align-items:center}
.pcard-num{font-size:44px;line-height:.9;color:var(--gold-2)}
.pcard-name{font-weight:800;font-size:15px;line-height:1.1;margin-top:auto;color:var(--fg)}
.pcard-pos{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.pcard-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pcard-stats div{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center}
.pcard-stats b{display:block;font-family:var(--font-display);font-size:26px;line-height:1;color:var(--fg)}
.pcard-stats small{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pcard-badges{display:flex;gap:6px;min-height:22px;font-size:17px;align-items:center}
.pcard-badge-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pcard-badge-list span{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;border:1px solid var(--gold-dim);color:var(--gold-2)}
.pcard .kv{padding:5px 0;font-size:12.5px}
@media(prefers-reduced-motion:reduce){.pcard-in{transition:none}}
.pcard,.pcard-in{min-height:240px}
.pcard-face{overflow:hidden}
.pcard .kv{padding:3px 0;font-size:12px}
.pcard-face.back .pcard-name{margin-top:2px;font-size:14px}
.pcard-badge-list{margin-top:6px}.pcard-badge-list span{font-size:10px;padding:3px 7px}

/* Card photos */
.pcard-photo{position:relative;margin:-12px -12px 6px;aspect-ratio:4/5;max-height:150px;overflow:hidden;border-radius:16px 16px 0 0;background:#000}
.pcard-photo img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;filter:saturate(1.05) contrast(1.05)}
.pcard-photo::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(180deg,transparent,#0c0c0e)}
.pcard-photo .pcard-num{position:absolute;left:10px;bottom:4px;font-size:40px;text-shadow:0 2px 10px rgba(0,0,0,.8);z-index:1}
.pcard-photo .crest{position:absolute;right:10px;top:10px;z-index:1;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.pcard-face.has-photo{padding-top:12px}
.pcard-face.has-photo .pcard-name{margin-top:0}
.pcard.has-photo-card,.pcard-in.has-photo-card{min-height:290px}
.pcard-photo{aspect-ratio:auto;height:170px;max-height:none}
.pcard-photo img{object-position:50% 15%}
.pcard,.pcard-in{min-height:300px}
.pcard-face.front:not(.has-photo) .pcard-top{margin-bottom:auto}

/* Coach, team photo, roster */
.coach-card{background:radial-gradient(120% 90% at 100% 0%,rgba(201,164,92,.22),transparent 55%),var(--surface);border-color:var(--gold-dim)}
.coach-head{display:flex;gap:16px;align-items:center}
.coach-photo{width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:50% 20%;flex:none;box-shadow:0 0 0 3px var(--gold),0 10px 30px rgba(0,0,0,.5);background:#000}

.coach-meta{min-width:0}
.coach-bio{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;color:var(--fg-2);font-size:14.5px;line-height:1.55;max-width:65ch}
.coach-bio p{margin:0 0 10px}
.team-photo-card{padding:8px}
.team-photo{width:100%;border-radius:14px;display:block}
.roster-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
@media(min-width:900px){.roster-list{grid-template-columns:repeat(3,1fr)}}
.roster-row{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
.roster-row .num{font-size:22px;color:var(--gold-2);text-align:center;line-height:1}
.roster-row small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.moments{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 6px 6px}
.moments::-webkit-scrollbar{display:none}

.moments figcaption{font-size:12px;color:var(--muted);margin-top:6px}
/* Card photo v2: cutout player on the card background, number top-left, no fade over the face */
.pcard-photo{height:190px;background:radial-gradient(90% 70% at 50% 100%,rgba(201,164,92,.35),transparent 70%),linear-gradient(180deg,#1b180f,#121113)}
.pcard-photo img{object-fit:contain;object-position:50% 100%;filter:none;padding-top:6px}

.pcard,.pcard-in{min-height:320px}

/* Jersey numbers */

.jersey-num.back-num{right:auto;left:-6px;top:auto;bottom:-24px;-webkit-text-stroke-color:rgba(233,205,130,.35)}

.pcard-photo{z-index:1}
.pcard-num.shiny{background:linear-gradient(180deg,#fff3c4 0%,#e9cd82 35%,#b8893a 60%,#f1dc9d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.pcard-num.shiny.big{font-size:72px;line-height:.9}
.pcard-photo .pcard-num.shiny{font-size:44px}
.pcard-face.front:not(.has-photo) .jersey-num{right:-10px;top:40px;font-size:200px;opacity:.35}

.jersey-num.in-photo{right:-4px;top:-14px;font-size:150px;opacity:.6;-webkit-text-stroke-color:rgba(233,205,130,.6);z-index:0}
.pcard-photo img{position:relative;z-index:1}
.pcard-photo .pcard-num,.pcard-photo .crest{z-index:2}
.pcard-face.front:not(.has-photo) .jersey-num{right:-8px;top:26px;font-size:150px;opacity:.4}

.coach-photo{width:120px;height:120px}
.coach-facts{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.coach-facts div{display:flex;flex-direction:column}
.coach-facts b{font-size:26px;line-height:1;color:var(--gold-2)}
.coach-facts small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.timeline{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
