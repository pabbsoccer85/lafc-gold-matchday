.coach-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}

.coach-name{font-size:clamp(30px,8.5vw,44px)}

/* Coach card */

/* ---- Number cards (v3): original flip layout, number is the hero ---- */
.cards.ncards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.cards.ncards{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.cards.ncards{grid-template-columns:repeat(4,1fr)}}
.ncard,.ncard .pcard-in{min-height:0!important;aspect-ratio:5/7}
.ncard{container-type:inline-size;display:block}
.ncard .pcard-in{height:100%}
.ncard .pcard-face{padding:0;border-radius:16px;overflow:hidden}
.nc-front{background:radial-gradient(110% 70% at 50% 115%,rgba(201,164,92,.42),transparent 60%),linear-gradient(170deg,#1a1710,#0b0b0d 65%)}
.nc-front>*{position:relative;z-index:2}
.nc-glow{position:absolute!important;inset:0;z-index:0;background:radial-gradient(60% 45% at 50% 48%,rgba(233,205,130,.22),transparent 70%)}
.nc-grid{position:absolute!important;inset:0;z-index:0;background-image:linear-gradient(rgba(233,205,130,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(233,205,130,.07) 1px,transparent 1px);background-size:14cqw 14cqw;mask-image:radial-gradient(80% 70% at 50% 50%,#000 30%,transparent 100%);-webkit-mask-image:radial-gradient(80% 70% at 50% 50%,#000 30%,transparent 100%)}
.nc-top{display:flex;align-items:center;gap:6px;padding:8px 9px 0}
.nc-top .crest{width:clamp(20px,11cqw,30px);height:clamp(20px,11cqw,30px)}
.nc-season{font-size:clamp(8px,4.8cqw,11px);letter-spacing:.14em;color:var(--fg-2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-pos{font-size:8px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--gold-2);border:1px solid var(--gold-dim);border-radius:999px;padding:2px 6px;white-space:nowrap}
.nc-numwrap{position:relative;display:grid;place-items:center;height:46%;margin-top:2%}
.nc-numwrap>span{grid-area:1/1;font-size:clamp(84px,58cqw,150px);line-height:.85;letter-spacing:-.02em}
.nc-num-shadow{color:rgba(0,0,0,.65);transform:translate(4cqw,4cqw);filter:blur(3px)}
.nc-num-outline{color:transparent;-webkit-text-stroke:1.5px rgba(233,205,130,.55);transform:translate(-2.5cqw,-2.5cqw)}
.nc-num{background:linear-gradient(175deg,#fff6d6 0%,#f1dc9d 22%,#c9a45c 48%,#8f6a2a 62%,#e9cd82 80%,#fff3c4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(233,205,130,.35))}
.ncard.lead .nc-num{animation:nc-shine 3.2s ease-in-out infinite;background-size:100% 200%}
@keyframes nc-shine{0%,100%{background-position:0 0}50%{background-position:0 100%}}
.nc-name{font-size:clamp(15px,8.6cqw,24px);letter-spacing:.04em;text-transform:uppercase;color:var(--fg);text-align:center;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.nc-stats{display:flex;align-items:flex-end;justify-content:center;gap:4%;padding:6px 8px 0}
.nc-stats>span{display:flex;flex-direction:column;align-items:center;line-height:1}
.nc-stats b{font-family:var(--font-display);font-size:clamp(20px,11cqw,30px);color:var(--gold-2)}
.nc-stats small{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.nc-badges{flex-direction:row!important;gap:2px;font-size:clamp(12px,6.5cqw,16px);padding-bottom:3px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.nc-badges i{font-style:normal}.nc-nobadge{color:var(--muted);opacity:.5}
.nc-team{position:absolute!important;left:0;right:0;bottom:6px;text-align:center;font-size:clamp(8px,4.6cqw,11px);letter-spacing:.2em;color:var(--gold);opacity:.85}
.ncard.lead .nc-front{border-color:var(--gold);box-shadow:0 10px 30px rgba(201,164,92,.3)}
.nc-back{transform:rotateY(180deg);padding:12px!important;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 10% 100%,rgba(201,164,92,.25),transparent 55%),linear-gradient(165deg,#15140f,#0c0c0e 70%)}
.nc-back-head{display:flex;justify-content:space-between;align-items:center}
.nc-back-num{font-size:clamp(22px,12cqw,30px);color:var(--gold-2);line-height:1}
.nc-back-name{font-size:clamp(16px,9cqw,24px);letter-spacing:.03em;text-transform:uppercase;color:var(--fg);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.nc-back-pos{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:3px}
.nc-rows{margin-top:6px;border-top:1px solid var(--line)}
.nc-rows div{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--line);font-size:clamp(11px,5.6cqw,13.5px);color:var(--fg-2)}
.nc-rows b{font-family:var(--font-display);font-size:clamp(18px,9.5cqw,24px);color:var(--fg);line-height:1}
.nc-badge-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.nc-badge-list span{font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;border:1px solid var(--gold-dim);color:var(--gold-2)}
.nc-flipback{margin:auto 0 0!important;text-align:center;font-size:9px!important;padding-top:4px}

.brand b.brand-long{font-size:clamp(16px,5vw,22px);overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.nc-back>*{flex-shrink:0}.nc-back .nc-flipback{flex-shrink:1;min-height:0;overflow:hidden}

/* ---- Team chat bubble ---- */
.chat-fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:0;border:0;background:none;padding:0;cursor:pointer;text-decoration:none;filter:drop-shadow(0 8px 20px rgba(0,0,0,.55))}
.chat-fab-btn{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#0a0a0c;background:linear-gradient(160deg,#fff3c4,#e9cd82 40%,#b8893a);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 0 0 2px rgba(10,10,12,.9);transition:transform .2s}
.chat-fab-btn svg{width:28px;height:28px;color:#0a0a0c}
.chat-fab:active .chat-fab-btn{transform:scale(.94)}
.chat-fab-ring{position:absolute;right:0;width:54px;height:54px;border-radius:50%;border:2px solid var(--gold-2);opacity:0;animation:chat-ping 2.8s ease-out infinite}
@keyframes chat-ping{0%{transform:scale(1);opacity:.7}70%{transform:scale(1.55);opacity:0}100%{opacity:0}}
.chat-fab-label{position:absolute;right:62px;top:50%;transform:translateY(-50%);font-size:15px;letter-spacing:.14em;color:var(--gold-2);background:rgba(10,10,12,.92);border:1px solid var(--gold-dim);border-radius:999px;padding:5px 12px 4px;white-space:nowrap;opacity:0;transform:translateY(-50%) translateX(8px);animation:chat-label 9s ease 3s infinite}
@keyframes chat-label{0%,6%{opacity:0;transform:translateY(-50%) translateX(8px)}10%,34%{opacity:1;transform:translateY(-50%) translateX(0)}40%,100%{opacity:0;transform:translateY(-50%) translateX(8px)}}
.chat-fab:hover .chat-fab-label{opacity:1;transform:translateY(-50%) translateX(0);animation:none}
@media(min-width:900px){.chat-fab{bottom:24px;right:24px}}
body:has(.intro) .chat-fab{display:none}
/* ---- Moment draft (shrunk photo preview) ---- */
.mom-draft{display:grid;grid-template-columns:120px 1fr;gap:12px;margin:12px 6px 0;padding:10px;border:1px dashed var(--gold-dim);border-radius:var(--r-s);background:var(--bg-2)}
.mom-draft img{width:120px;height:120px;object-fit:cover;border-radius:10px;background:#000}
.mom-draft-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.mom-draft-side input{width:100%;box-sizing:border-box}
.mom-draft-actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:420px){.mom-draft{grid-template-columns:96px 1fr}.mom-draft img{width:96px;height:96px}}
.nc-back{padding:10px!important}.nc-rows div{padding:2px 0}.nc-rows b{font-size:clamp(16px,8.5cqw,22px)}.nc-back-pos{margin-top:2px}.nc-rows{margin-top:5px}.nc-badge-list{margin-top:5px}.nc-badge-list span{font-size:9px;padding:2px 6px}
/* iOS Safari: composited children (filters, gradient text) ignore the parent's backface-visibility — hide the hidden face outright */
.ncard .pcard-face,.ncard .pcard-face *{-webkit-backface-visibility:hidden;backface-visibility:hidden}
.ncard .nc-front,.ncard .nc-back{transition:visibility 0s linear .27s}
.ncard.flipped .nc-front{visibility:hidden}
.ncard:not(.flipped) .nc-back{visibility:hidden}

.slider-help{font-size:11.5px;color:var(--muted);margin:6px 0 0;line-height:1.35}
.slider input[type=range]{touch-action:pan-y}

/* team calendar rows */
.ev-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(201,164,92,.08),transparent 60%)}
.ev-row.practice{background:linear-gradient(90deg,rgba(60,200,120,.10),transparent 60%)}
.ev-row.tournament{background:linear-gradient(90deg,rgba(233,205,130,.16),transparent 60%)}
.ev-row.past{opacity:.6}
.ev-row .when{display:flex;flex-direction:column;font-size:9px;letter-spacing:.1em;color:var(--muted)}
.ev-row .when b{font-size:12px;color:var(--fg);letter-spacing:0}
.ev-main{min-width:0}
.ev-title{font-weight:700;font-size:14px;color:var(--fg)}
.ev-row .row-note{margin-top:2px}
.ev-add{white-space:nowrap}

.pick-chip{background:rgba(201,164,92,.14);border:1px solid var(--gold-dim);color:var(--gold-2);font-weight:700}

/* ---- Call it: scoreboard ---- */
.callit .card-h{flex-wrap:wrap;gap:8px}
.seg.sm button{padding:5px 10px;font-size:12px}
.call-list{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.call-list::-webkit-scrollbar{display:none}
.call-chip{white-space:nowrap;font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);color:var(--fg-2)}
.call-chip.on{border-color:var(--gold);color:var(--gold-2);background:rgba(201,164,92,.14)}
.call-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.call-when{text-align:center;min-width:0}
.call-when b{display:block;font-family:var(--font-display);font-size:20px;letter-spacing:.04em;color:var(--fg)}
.call-when small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:14px 8px 10px;border-radius:18px;background:radial-gradient(120% 90% at 50% 0%,rgba(201,164,92,.18),transparent 60%),linear-gradient(180deg,#141210,#0c0c0e);border:1px solid var(--gold-dim);box-shadow:inset 0 0 0 1px rgba(233,205,130,.06),0 10px 30px rgba(0,0,0,.45)}
.board-side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.board-side b{font-size:12.5px;line-height:1.15}
.board-side .ours-tag{font-size:9px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.board-digits{display:flex;align-items:flex-start;gap:4px}
.digit-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.digit{width:clamp(58px,17vw,84px);height:clamp(72px,21vw,104px);border-radius:14px;border:1px solid rgba(233,205,130,.35);background:linear-gradient(180deg,#1d1a12,#0a0a0c);color:var(--gold-2);font-size:clamp(48px,15vw,76px);line-height:1;display:grid;place-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.06),inset 0 -14px 20px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.5);position:relative;transition:transform .12s}
.digit::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.6)}
.digit:active{transform:scale(.96)}
.digit.pop{animation:digit-pop .3s ease}
@keyframes digit-pop{0%{transform:translateY(-6px) scale(1.06);filter:brightness(1.4)}100%{transform:none;filter:none}}
.digit-minus{width:34px;height:26px;border-radius:8px;background:var(--surface-2);color:var(--fg-2);font-weight:800;font-size:16px;line-height:1}
.board-colon{font-size:clamp(40px,12vw,64px);color:var(--gold-dim);line-height:1;margin-top:8px}
.board-hint{text-align:center;margin:8px 0 10px}
.board-actions{display:flex;gap:8px}
.board-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-top:10px}
.board-meta b{color:var(--gold-2)}
.last-call{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);font-size:13px;color:var(--fg)}
.last-call.exact{border-color:var(--gold)}.last-call.result{border-color:var(--win)}
.last-call .streak{margin-top:4px;color:var(--gold-2);font-weight:700}
details.season-lab{padding:14px 16px}
details.season-lab summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
details.season-lab summary::-webkit-details-marker{display:none}
details.season-lab summary::before{content:"▸";color:var(--gold);font-size:14px}
details.season-lab[open] summary::before{content:"▾"}

.linklike{background:none;border:0;padding:0;color:var(--gold-2);font:inherit;text-decoration:underline;cursor:pointer}

/* practices tab */
.tabbar button{font-size:9.5px;letter-spacing:0}
.practices-hero{background:radial-gradient(120% 80% at 90% 0%,rgba(60,200,120,.18),transparent 55%),linear-gradient(165deg,#11160f,#0c0c0e 70%)}
.pr-next{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pr-date{font-size:34px;line-height:1;color:var(--fg)}
.pr-date small{display:block;font-family:var(--font-body);font-size:13px;color:var(--gold-2);font-weight:700;letter-spacing:.04em;margin-top:4px}
.pr-where a{color:var(--gold-2)}
/* manager sections */
details.mgr-sec{border-top:1px solid var(--line);padding:6px 0}
details.mgr-sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 0}
details.mgr-sec>summary::-webkit-details-marker{display:none}
details.mgr-sec>summary::after{content:"▸";margin-left:auto;color:var(--gold);font-size:14px}
details.mgr-sec[open]>summary::after{content:"▾"}
.mgr-sticky{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(20,18,12,.96);border:1px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:13px;color:var(--fg)}
.mgr-sticky span{flex:1}.mgr-sticky b{color:var(--gold-2)}
@media(min-width:900px){.mgr-sticky{bottom:16px;left:auto;right:24px;width:360px}}
body:has(.mgr-sticky) .chat-fab{bottom:calc(136px + env(safe-area-inset-bottom,0px))}

.kit-line{color:var(--fg-2)}.kit-line b{color:var(--gold-2)}
.kit-next{margin-top:6px;font-size:12.5px;color:var(--fg-2)}.kit-next b{color:var(--gold-2)}

/* ---- Theme toggle + White & Gold theme ---- */
.theme-toggle{margin-left:auto;position:relative;width:48px;height:26px;border-radius:999px;border:1px solid var(--gold-dim);background:var(--bg-2);cursor:pointer;flex-shrink:0;padding:0}
.theme-toggle .tt-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--gold);transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.theme-toggle .tt-ico{position:absolute;top:50%;right:6px;transform:translateY(-50%);font-size:12px;line-height:1}
:root[data-theme="light"] .theme-toggle .tt-knob{transform:translateX(22px)}
:root[data-theme="light"] .theme-toggle .tt-ico{right:auto;left:6px}
.live-pill{margin-left:0}
:root[data-theme="light"]{
  --bg:#faf8f3; --bg-2:#ffffff; --surface:#fffdf8; --surface-2:#f1ece0; --line:#e6dfd0; --line-2:#d3c9b2;
  --fg:#15130e; --fg-2:#3d3628; --muted:#6b6352;
  --gold:#8a6616; --gold-2:#6a4c0a; --gold-dim:#cdb780; --gold-ink:#1a1407;
  --gold-fill:#c9a45c; --gold-fill-2:#e2c678;
  --win:#1f9d55; --loss:#c9403f; --draw:#8a7a45; --info:#2e78a6;
  --shadow:0 12px 30px rgba(80,60,15,.12);
  color-scheme:light;
}
:root[data-theme="light"] body{background:var(--bg);color:var(--fg)}
:root[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(250,248,243,.98),rgba(250,248,243,.92))}
:root[data-theme="light"] .tabbar{background:rgba(255,255,255,.96)}
:root[data-theme="light"] .brand img{background:#fff}
:root[data-theme="light"] .hero{background:radial-gradient(120% 90% at 85% 10%,rgba(180,140,58,.22),transparent 55%),radial-gradient(80% 70% at 10% 90%,rgba(180,140,58,.10),transparent 60%),linear-gradient(160deg,#fffdf6,#f6f0e1 60%)}
:root[data-theme="light"] .hero .pitch{opacity:.12;filter:invert(1)}
:root[data-theme="light"] .practices-hero{background:radial-gradient(120% 80% at 90% 0%,rgba(31,157,85,.14),transparent 55%),linear-gradient(165deg,#fbfdf8,#f4f1e8 70%)}
:root[data-theme="light"] .mgr-sticky{background:rgba(255,253,246,.98);color:var(--fg)}
:root[data-theme="light"] .pcard-face{background:radial-gradient(120% 80% at 90% 0%,rgba(180,140,58,.18),transparent 55%),linear-gradient(165deg,#fffdf6,#f3eee2 70%)}
:root[data-theme="light"] .pcard-face.back,:root[data-theme="light"] .nc-back{background:radial-gradient(120% 80% at 10% 100%,rgba(180,140,58,.16),transparent 55%),linear-gradient(165deg,#fffdf6,#f3eee2 70%)}
:root[data-theme="light"] .coach-pcard,:root[data-theme="light"] .coach-pcard-photo,:root[data-theme="light"] .pcard-photo{background:linear-gradient(180deg,#fff,#f1ece0)}
:root[data-theme="light"] .form i{color:#fff}
:root[data-theme="light"] .chat-fab-btn svg{color:#1a1407}
:root[data-theme="light"] .msg.me{background:linear-gradient(160deg,rgba(180,140,58,.22),rgba(180,140,58,.10))}
:root[data-theme="light"] .name-ask{background:rgba(250,248,243,.8)}
:root[data-theme="light"] .lb-row.me,:root[data-theme="light"] .ours{background:rgba(180,140,58,.10)}
:root[data-theme="light"] .intro{background:#050506} /* the opening sequence stays black & gold */
/* the trading cards and the Call-it scoreboard stay black & gold on purpose: they are the "stadium" pieces of the white theme */
.brand b.brand-long{max-width:calc(100vw - 160px);font-size:clamp(15px,4.6vw,22px)}@media(min-width:900px){.brand b.brand-long{max-width:none}}

/* White & gold: keep fills warm gold while text golds go dark for contrast */
:root[data-theme="light"] .btn.gold{background:linear-gradient(180deg,var(--gold-fill-2),var(--gold-fill));color:var(--gold-ink)}
:root[data-theme="light"] .topnav button[aria-selected="true"],:root[data-theme="light"] .chip.solid,:root[data-theme="light"] .rank.top,:root[data-theme="light"] .seg button[aria-pressed="true"],:root[data-theme="light"] .prob i:nth-child(1),:root[data-theme="light"] .compare-row .bars i:first-child,:root[data-theme="light"] .toast,:root[data-theme="light"] .gb-bar i,:root[data-theme="light"] .theme-toggle .tt-knob{background:var(--gold-fill)}
:root[data-theme="light"] .toast{color:var(--gold-ink)}
:root[data-theme="light"] .tabbar button[aria-selected="true"],:root[data-theme="light"] .brand b{color:var(--gold-2)}
:root[data-theme="light"] .chat-fab-btn{background:linear-gradient(180deg,var(--gold-fill-2),var(--gold-fill))}
:root[data-theme="light"] .chat-fab-ring{border-color:var(--gold-fill)}
:root[data-theme="light"] .nc-num,:root[data-theme="light"] .digit,:root[data-theme="light"] .tc-num{color:var(--gold-fill-2)}
:root[data-theme="light"] .nc-stats b,:root[data-theme="light"] .nc-side,:root[data-theme="light"] .board-side b,:root[data-theme="light"] .board-meta,:root[data-theme="light"] .nc-team,:root[data-theme="light"] .nc-pos,:root[data-theme="light"] .nc-season{color:#e9cd82}
:root[data-theme="light"] .board-side b{color:#f5f2ea}
:root[data-theme="light"] .board-meta b{color:#e9cd82}
:root[data-theme="light"] .nc-front .nc-season,:root[data-theme="light"] .nc-stats small{color:#bdb9b0}
:root[data-theme="light"] .nc-name{color:#f5f2ea}
:root[data-theme="light"] .score.num{color:var(--fg)}
:root[data-theme="light"] .hero .big,:root[data-theme="light"] .scoreline .big{color:var(--fg)}
:root[data-theme="light"] .chart .axis{fill:var(--muted)}
:root[data-theme="light"] .form i{color:#fff}

/* event page */
.ev-row.tap{width:100%;text-align:left;border:0;cursor:pointer;color:inherit;font:inherit;grid-template-columns:52px 1fr 14px}

<script>
/* LAFC Gold Matchday — app. Vanilla JS. Data lives in #gold-data; crests in #gold-crests. */
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DATA=JSON.parse($('#gold-data').textContent);
const CRESTS=JSON.parse($('#gold-crests').textContent);
const GOLD=DATA.meta.gold??7;
const teams=DATA.teams.slice().sort((a,b)=>a.id-b.id);
const T=id=>teams[id];
const N=teams.length;
let matches=DATA.matches.slice();
let pool=DATA.pool||[];
let roster=(DATA.roster||[]).slice();
const staff=DATA.staff||[];
let scorers=DATA.scorers||{};
const META=DATA.meta;let events=(META.events||[]).slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
const crestSrc=id=>CRESTS.files[CRESTS.map[String(id)]]||'';
const crest=(id,size='md')=>`<span class="crest ${size} ${id===GOLD?'gold':''}">${crestSrc(id)?`<img src="${crestSrc(id)}" alt="">`:'<small>'+esc(T(id).initials)+'</small>'}</span>`;
const store={get(k,d){try{const v=localStorage.getItem('gold.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gold.'+k,JSON.stringify(v))}catch(e){}}};
const THEME_KEY='theme';function applyTheme(t){document.documentElement.dataset.theme=t;try{const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#faf8f3':'#0a0a0c')}catch(e){}}
function currentTheme(){return store.get(THEME_KEY,'dark')}
applyTheme(currentTheme());
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=(d,o={month:'short',day:'numeric'})=>new Date(d+'T12:00:00').toLocaleDateString('en-US',o);
const signed=n=>n>0?'+'+n:String(n);
const pct=n=>Math.round(n*100)+'%';
const isFinal=m=>m.hg!=null&&m.ag!=null&&m.status!=='postponed';
// picks close at kickoff: a game whose date (and listed kickoff time) has passed can't be predicted even if the score isn't posted yet
const kickedOff=m=>{const t=todayISO();if(m.date<t)return true;if(m.date>t)return false;const mt=/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i.exec(m.time||'');if(!mt)return false;let h=+mt[1];const mi=+mt[2];if(mt[3]&&/pm/i.test(mt[3])&&h<12)h+=12;if(mt[3]&&/am/i.test(mt[3])&&h===12)h=0;const n=new Date();return n.getHours()*60+n.getMinutes()>=h*60+mi};
const pairKey=(a,b)=>a<b?a+'-'+b:b+'-'+a;
const nowMs=()=>Date.now();

/* ---------- Model (opponent-adjusted ridge ratings, normal margins) ---------- */
function standings(ms,picks={}){
  const rows=teams.map(t=>({...t,gp:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0,ppg:0,form:[]}));
  for(const m of ms){
    let s=null; if(isFinal(m))s=[m.hg,m.ag]; else if(picks[m.id])s=picks[m.id]; if(!s)continue;
    const [a,b]=s;
    for(const [id,f,c] of [[m.home,a,b],[m.away,b,a]]){const r=rows[id];r.gp++;r.gf+=f;r.ga+=c;if(f>c){r.w++;r.pts+=3;r.form.push('W')}else if(f<c){r.l++;r.form.push('L')}else{r.d++;r.pts++;r.form.push('D')}}
  }
  for(const r of rows){r.gd=r.gf-r.ga;r.ppg=r.gp?r.pts/r.gp:0}
  rows.sort((a,b)=>b.ppg-a.ppg||b.gd-a.gd||b.gf-a.gf||a.short.localeCompare(b.short));
  return rows.map((r,i)=>({...r,rank:i+1}));
}
function solve(A,b){A=A.map((r,i)=>[...r,b[i]]);const n=b.length;for(let i=0;i<n;i++){let p=i;for(let j=i+1;j<n;j++)if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;[A[i],A[p]]=[A[p],A[i]];const d=A[i][i]||1e-9;for(let k=i;k<=n;k++)A[i][k]/=d;for(let j=0;j<n;j++){if(j===i)continue;const f=A[j][i];for(let k=i;k<=n;k++)A[j][k]-=f*A[i][k]}}return A.map(r=>r[n])}

  const actual=standings(ms,picks),byId=Object.fromEntries(actual.map(r=>[r.id,r]));
  const done=new Set(ms.filter(m=>isFinal(m)||picks[m.id]).map(m=>pairKey(m.home,m.away)));
  const scores=Array.from({length:N},()=>[]),ratings=[];
  for(const cap of[3,5])for(const ridge of[.5,1,2]){const s=fit(ms,cap,ridge);s[GOLD]+=boost;ratings.push(s);const pts=teams.map(t=>byId[t.id].pts);
    for(let a=0;a<N;a++)for(let b=a+1;b<N;b++){if(done.has(a+'-'+b))continue;const p=chances(s[a]-s[b],chaos);pts[a]+=3*p.win+p.draw;pts[b]+=3*p.loss+p.draw}
    pts.forEach((v,i)=>scores[i].push(v))}
  const strength=teams.map(t=>ratings.reduce((s,r)=>s+r[t.id],0)/ratings.length);
  const rows=teams.map(t=>({...t,pts:byId[t.id].pts,projected:scores[t.id].reduce((a,b)=>a+b,0)/scores[t.id].length,lo:Math.min(...scores[t.id]),hi:Math.max(...scores[t.id]),rating:strength[t.id]})).sort((a,b)=>b.projected-a.projected).map((r,i)=>({...r,rank:i+1}));
  return{rows,strength,byId};
}
function simulate(ms,picks={},boost=0,chaos=2.5,runs=2000,seed=7){
  const f=forecast(ms,picks,boost,chaos),rng=seeded(seed),counts=teams.map(()=>Array(N).fill(0));
  const done=new Set(ms.filter(m=>isFinal(m)||picks[m.id]).map(m=>pairKey(m.home,m.away)));
  for(let n=0;n<runs;n++){const pts=teams.map(t=>f.byId[t.id].pts),gd=teams.map(t=>f.byId[t.id].gd),ab=f.strength.map(x=>x+normal(rng)*.6);
    for(let a=0;a<N;a++)for(let b=a+1;b<N;b++){if(done.has(a+'-'+b))continue;const mg=Math.round(ab[a]-ab[b]+normal(rng)*chaos);pts[a]+=mg>0?3:mg===0?1:0;pts[b]+=mg<0?3:mg===0?1:0;gd[a]+=mg;gd[b]-=mg}
    const order=teams.map(t=>t.id).sort((a,b)=>pts[b]-pts[a]||gd[b]-gd[a]||rng()-.5);order.forEach((id,r)=>counts[id][r]++)}
  return{runs,rows:teams.map(t=>({...t,first:counts[t.id][0]/runs,top3:counts[t.id].slice(0,3).reduce((a,b)=>a+b,0)/runs,top6:counts[t.id].slice(0,6).reduce((a,b)=>a+b,0)/runs,avg:counts[t.id].reduce((a,b,i)=>a+b*(i+1),0)/runs,dist:counts[t.id]})).sort((a,b)=>a.avg-b.avg)};
}
function simulateMatch(h,a,strength,chaos=2.5){const mg=Math.max(-12,Math.min(12,Math.round(strength[h]-strength[a]+normal()*chaos))),base=Math.floor(Math.random()*3);return[base+Math.max(mg,0),base+Math.max(-mg,0)]}

const nextGold=()=>{const t=todayISO();const up=goldMatches().filter(m=>!isFinal(m)&&m.status!=='postponed'&&m.date>=t);return up[0]||goldMatches().filter(m=>!isFinal(m)&&m.status!=='postponed').slice(-1)[0]};

function goldSide(m){return m.home===GOLD?{gf:m.hg,ga:m.ag,opp:m.away,at:'home'}:{gf:m.ag,ga:m.hg,opp:m.home,at:'away'}}
function kickoffMs(m){if(!m.time)return new Date(m.date+'T12:00:00').getTime();const [hm,ap]=m.time.split(' ');let [h,mi]=hm.split(':').map(Number);h=h%12+(ap==='PM'?12:0);return new Date(m.date+'T'+String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')+':00').getTime()}
function rankHistory(){const dates=[...new Set(finals().map(m=>m.date))].sort();return dates.map(d=>{const t=standings(matches.filter(m=>m.date<=d));const g=t.find(r=>r.id===GOLD);const gm=finals().filter(m=>m.date===d&&(m.home===GOLD||m.away===GOLD));const res=gm.map(m=>{const s=goldSide(m);return(s.gf>s.ga?'W':s.gf<s.ga?'L':'D')+' '+s.gf+'–'+s.ga});return{date:d,rank:g.rank,pts:g.pts,gp:g.gp,played:gm.length>0,res}})}

/* ---------- Pick codes ---------- */
const b64u=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4))));
function makeCode(name,picks){const p={};for(const [id,v] of Object.entries(picks))p[id]=v[0]+'-'+v[1];return 'GOLD1.'+b64u(JSON.stringify({n:name,p,t:Date.now()}))}
function parseCode(code){try{code=code.trim();if(!code.startsWith('GOLD1.'))return null;const o=JSON.parse(unb64u(code.slice(6)));if(!o||typeof o.n!=='string'||typeof o.p!=='object')return null;const picks={};for(const [id,v] of Object.entries(o.p)){const m=/^(\d{1,2})-(\d{1,2})$/.exec(String(v));if(m&&matches.find(x=>x.id===id))picks[id]=[+m[1],+m[2]]}return{name:o.n.slice(0,40),picks,t:o.t||Date.now()}}catch(e){return null}}
function parseGoalCode(code){try{code=code.trim();if(!code.startsWith('GOLD1G.'))return null;const o=JSON.parse(unb64u(code.slice(7)));if(!o||!matches.find(x=>x.id===o.m)||!Array.isArray(o.r))return null;const rows=o.r.map(([n,g,a])=>({num:+n,g:Math.max(0,Math.min(20,+g||0)),a:Math.max(0,Math.min(20,+a||0))})).filter(r=>r.g||r.a);return{mid:o.m,rows}}catch(e){return null}}
function scoreEntry(entry){let pts=0,exact=0,results=0,graded=0;for(const [id,[h,a]] of Object.entries(entry.picks)){const m=matches.find(x=>x.id===id);if(!m||!isFinal(m))continue;graded++;const o1=Math.sign(h-a),o2=Math.sign(m.hg-m.ag);if(h===m.hg&&a===m.ag){pts+=3;exact++}else if(o1===o2){pts+=1;results++}}return{pts,exact,results,graded,total:Object.keys(entry.picks).length}}

function rankChart(h){if(!h.length)return '<div class="empty">No matchdays yet.</div>';const W=600,H=260,pl=34,pr=18,pt=34,pb=40;const xs=i=>pl+(h.length===1?0:(i/(h.length-1)))*(W-pl-pr);const ys=r=>pt+((r-1)/(N-1))*(H-pt-pb);
  const grid=[1,5,10,15,N].map(r=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${ys(r)}" y2="${ys(r)}"/><text class="axis" x="${pl-8}" y="${ys(r)+4}" text-anchor="end">${r}</text>`).join('');
  const path=h.map((p,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(p.rank).toFixed(1)).join(' ');
  const area=path+` L${xs(h.length-1).toFixed(1)} ${H-pb} L${xs(0).toFixed(1)} ${H-pb} Z`;
  const anchor=i=>i===0?'start':i===h.length-1?'end':'middle';
  const dots=h.map((p,i)=>{const last=i===h.length-1;const x=xs(i),y=ys(p.rank);const dot=p.played?`<circle cx="${x}" cy="${y}" r="${last?6.5:5}" fill="${last?'var(--gold-2)':'var(--gold)'}" stroke="var(--bg)" stroke-width="2"/>`:`<circle cx="${x}" cy="${y}" r="4" fill="var(--bg)" stroke="var(--gold)" stroke-width="2"/>`;
    const tag=p.played?`<text x="${x}" y="${y-11}" text-anchor="${anchor(i)}" style="fill:${last?'var(--gold-2)':'var(--fg-2)'};font-weight:700;font-size:${last?'13px':'10px'}">${last?'#'+p.rank+' · ':''}${esc(p.res.join(', '))}</text>`:(last?`<text x="${x}" y="${y-11}" text-anchor="end" style="fill:var(--gold-2);font-weight:700;font-size:13px">#${p.rank}</text>`:'');
    return dot+tag}).join('');
  const labels=h.map((p,i)=>`<text class="axis" x="${xs(i)}" y="${H-(h.length>7&&i%2?6:18)}" text-anchor="${anchor(i)}">${fmtDate(p.date)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gold's league position after each matchday">${grid}<path d="${area}" fill="url(#gg)" opacity=".35"/><defs><linearGradient id="gg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--gold)"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs><path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}<text class="axis" x="${pl-8}" y="${pt-16}" text-anchor="end" style="font-size:9px">POS</text><g transform="translate(${W-pr},${pt-18})"><circle cx="-150" cy="0" r="4.5" fill="var(--gold)"/><text class="axis" x="-142" y="3.5">Gold played</text><circle cx="-62" cy="0" r="3.5" fill="var(--bg)" stroke="var(--gold)" stroke-width="2"/><text class="axis" x="-54" y="3.5">idle day</text></g></svg>`}
function goalsChart(rows){const W=600,rh=26,pl=118,pr=36,H=rows.length*rh+30;const max=Math.max(...rows.map(r=>Math.max(r.gf,r.ga)),1);const sx=v=>pl+(v/max)*(W-pl-pr);
  const ticks=[0,Math.round(max/2),max].map(v=>`<line class="grid" x1="${sx(v)}" x2="${sx(v)}" y1="8" y2="${H-22}"/><text class="axis" x="${sx(v)}" y="${H-6}" text-anchor="middle">${v}</text>`).join('');
  const bars=rows.map((r,i)=>{const y=12+i*rh;return `<text x="${pl-8}" y="${y+12}" text-anchor="end" style="${r.id===GOLD?'fill:var(--gold-2);font-weight:700':''}">${esc(r.short)}</text><rect x="${pl}" y="${y}" width="${Math.max(0,sx(r.gf)-pl)}" height="8" rx="3" fill="var(--gold)"/><rect x="${pl}" y="${y+10}" width="${Math.max(0,sx(r.ga)-pl)}" height="6" rx="3" fill="var(--line-2)"/><text x="${sx(r.gf)+5}" y="${y+8}" style="font-size:10px;fill:var(--fg-2);font-weight:700">${r.gf}</text><text x="${sx(r.ga)+5}" y="${y+16}" style="font-size:9px;fill:var(--muted)">${r.ga}</text>`}).join('');

function parseTime(t){const m=/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i.exec(t||'');if(!m)return null;let h=+m[1];const mi=+m[2];if(m[3]&&/pm/i.test(m[3])&&h<12)h+=12;if(m[3]&&/am/i.test(m[3])&&h===12)h=0;return[h,mi]}

function applyEdits(){

function buildPage(newData){
  // Rebuild the full published document from the embedded template (no network needed).
  const tpl=document.getElementById('gold-template');if(!tpl)throw{code:'no_template'};
  const template=tpl.textContent.replace(/<\\\/script/g,'<'+'/script');
  const dataJson=JSON.stringify(newData).replace(/<\//g,'<\\/');
  const crestsJson=document.getElementById('gold-crests').textContent;
  const tplBlock='<script type="text/template" id="gold-template">'+tpl.textContent+'<'+'/script>';
  const content=template.replace('@@GOLD_DATA@@',dataJson).replace('@@GOLD_CRESTS@@',crestsJson).replace('@@GOLD_TEMPLATE@@',tplBlock);
  if(!content.includes('id="gold-data"')||!content.includes('id="gold-template"'))throw{code:'bad_template'};
  const SKELETON_HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
  return SKELETON_HEAD+content+'<'+'/body><'+'/html>';
}
function pubStatus(msg,done){const st=$('#mgr-status');if(st)st.textContent=msg;toast(msg);const b1=$('#mgr-publish'),b2=$('#rep-save');[b1,b2].forEach(b=>{if(!b)return;b.disabled=!done;if(!done)b.textContent='Publishing…'})}

    const newData={...DATA,meta:{...META,snapshotLabel:label,lastChecked:new Date().toISOString(),updatedBy:'manager mode',moments:state.mgrMoments||META.moments||[],chatLink:state.mgrChatLink??META.chatLink??'',momentsAlbum:state.mgrAlbum??META.momentsAlbum??'',events:state.mgrEvents||events,kitHome:state.mgrKitHome??META.kitHome??'White',kitAway:state.mgrKitAway??META.kitAway??'Black',arriveMinutes:state.mgrArrive??META.arriveMinutes??45},matches:newMatches,pool:newPool,roster:newRoster,scorers:newScorers};

function drawShareCard(){const c=$('#share-canvas');const x=c.getContext('2d');const W=c.width,H=c.height;const tbl=standings(matches),g=tbl.find(r=>r.id===GOLD);const last=lastGoldFinal();

/* ---------- Intro sequence ---------- */
function intro(){
  let skip=false;try{skip=sessionStorage.getItem('gold.intro')==='1'||!!sessionStorage.getItem('gold.flash')}catch(e){}
  if(skip||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  try{sessionStorage.setItem('gold.intro','1')}catch(e){}
  const el=document.createElement('div');el.className='intro';el.setAttribute('role','presentation');
  const letters=(w,d0,cls='')=>`<div class="word ${cls}" aria-hidden="true">${[...w].map((c,i)=>`<span style="animation-delay:${(d0+i*.07).toFixed(2)}s">${c===' '?'&nbsp;':c}</span>`).join('')}</div>`;
  el.innerHTML=`<div class="beam l"></div><div class="beam r"></div><div class="ring"></div><div class="ring two"></div><div class="dust">${Array.from({length:26},(_,i)=>`<i style="left:${Math.random()*100}%;top:${40+Math.random()*60}%;animation-delay:${(Math.random()*3).toFixed(2)}s"></i>`).join('')}</div>
   <div class="stage"><div class="crest-wrap"><img src="${crestSrc(GOLD)}" alt="LAFC So Cal crest"></div>${letters('LAFC SOCAL',1.5,'wide')}${letters('2013/14 GOLD',2.35,'gold wide')}<div class="line"></div><div class="sub">ECNL RL · Southern Cal · Boys U13 · ${esc(META.season)}</div><div class="sub2">BLACK. GOLD. TOGETHER.</div></div><div class="skip" role="button">Tap to skip</div>`;
  const end=()=>{if(!el.isConnected)return;el.classList.add('done');setTimeout(()=>el.remove(),500)};
  el.querySelector('.skip').addEventListener('click',e=>{e.stopPropagation();end()});
  el.addEventListener('click',end);
  el.addEventListener('animationend',e=>{if(e.target===el)el.remove()});
  document.body.appendChild(el);setTimeout(end,7800);

const b64u=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4))));
function makeCode(name,picks){const p={};for(const [id,v] of Object.entries(picks))p[id]=v[0]+'-'+v[1];return 'GOLD1.'+b64u(JSON.stringify({n:name,p,t:Date.now()}))}
function parseCode(code){try{code=code.trim();if(!code.startsWith('GOLD1.'))return null;const o=JSON.parse(unb64u(code.slice(6)));if(!o||typeof o.n!=='string'||typeof o.p!=='object')return null;const picks={};for(const [id,v] of Object.entries(o.p)){const m=/^(\d{1,2})-(\d{1,2})$/.exec(String(v));if(m&&matches.find(x=>x.id===id))picks[id]=[+m[1],+m[2]]}return{name:o.n.slice(0,40),picks,t:o.t||Date.now()}}catch(e){return null}}
function parseGoalCode(code){try{code=code.trim();if(!code.startsWith('GOLD1G.'))return null;const o=JSON.parse(unb64u(code.slice(7)));if(!o||!matches.find(x=>x.id===o.m)||!Array.isArray(o.r))return null;const rows=o.r.map(([n,g,a,k,sv,gc])=>({num:+n,g:Math.max(0,Math.min(20,+g||0)),a:Math.max(0,Math.min(20,+a||0)),...(+k?{k:1,sv:Math.max(0,Math.min(60,+sv||0)),gc:Math.max(0,Math.min(20,+gc||0))}:{})})).filter(r=>r.g||r.a||r.k);return{mid:o.m,rows}}catch(e){return null}}
function scoreEntry(entry){let pts=0,exact=0,results=0,graded=0;for(const [id,[h,a]] of Object.entries(entry.picks)){const m=matches.find(x=>x.id===id);if(!m||!isFinal(m))continue;graded++;const o1=Math.sign(h-a),o2=Math.sign(m.hg-m.ag);if(h===m.hg&&a===m.ag){pts+=3;exact++}else if(o1===o2){pts+=1;results++}}return{pts,exact,results,graded,total:Object.keys(entry.picks).length}}

function rankChart(h){if(!h.length)return '<div class="empty">No matchdays yet.</div>';const W=600,H=260,pl=34,pr=18,pt=34,pb=40;const xs=i=>pl+(h.length===1?0:(i/(h.length-1)))*(W-pl-pr);const ys=r=>pt+((r-1)/(N-1))*(H-pt-pb);
  const grid=[1,5,10,15,N].map(r=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${ys(r)}" y2="${ys(r)}"/><text class="axis" x="${pl-8}" y="${ys(r)+4}" text-anchor="end">${r}</text>`).join('');
  const path=h.map((p,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(p.rank).toFixed(1)).join(' ');
  const area=path+` L${xs(h.length-1).toFixed(1)} ${H-pb} L${xs(0).toFixed(1)} ${H-pb} Z`;
  const anchor=i=>i===0?'start':i===h.length-1?'end':'middle';
  const dots=h.map((p,i)=>{const last=i===h.length-1;const x=xs(i),y=ys(p.rank);const dot=p.played?`<circle cx="${x}" cy="${y}" r="${last?6.5:5}" fill="${last?'var(--gold-2)':'var(--gold)'}" stroke="var(--bg)" stroke-width="2"/>`:`<circle cx="${x}" cy="${y}" r="4" fill="var(--bg)" stroke="var(--gold)" stroke-width="2"/>`;
    const tag=p.played?`<text x="${x}" y="${y-11}" text-anchor="${anchor(i)}" style="fill:${last?'var(--gold-2)':'var(--fg-2)'};font-weight:700;font-size:${last?'13px':'10px'}">${last?'#'+p.rank+' · ':''}${esc(p.res.join(', '))}</text>`:(last?`<text x="${x}" y="${y-11}" text-anchor="end" style="fill:var(--gold-2);font-weight:700;font-size:13px">#${p.rank}</text>`:'');
    return dot+tag}).join('');
  const labels=h.map((p,i)=>`<text class="axis" x="${xs(i)}" y="${H-(h.length>7&&i%2?6:18)}" text-anchor="${anchor(i)}">${fmtDate(p.date)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gold's league position after each matchday">${grid}<path d="${area}" fill="url(#gg)" opacity=".35"/><defs><linearGradient id="gg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--gold)"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs><path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}<text class="axis" x="${pl-8}" y="${pt-16}" text-anchor="end" style="font-size:9px">POS</text><g transform="translate(${W-pr},${pt-18})"><circle cx="-150" cy="0" r="4.5" fill="var(--gold)"/><text class="axis" x="-142" y="3.5">Gold played</text><circle cx="-62" cy="0" r="3.5" fill="var(--bg)" stroke="var(--gold)" stroke-width="2"/><text class="axis" x="-54" y="3.5">idle day</text></g></svg>`}
function goalsChart(rows){const W=600,rh=26,pl=118,pr=36,H=rows.length*rh+30;const max=Math.max(...rows.map(r=>Math.max(r.gf,r.ga)),1);const sx=v=>pl+(v/max)*(W-pl-pr);

const EVENT_KIND={practice:['Practice','⚽'],event:['Team event','🎉'],tournament:['Tournament','🏆'],other:['Note','📌']};
function parseTime(t){const m=/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i.exec(t||'');if(!m)return null;let h=+m[1];const mi=+m[2];if(m[3]&&/pm/i.test(m[3])&&h<12)h+=12;if(m[3]&&/am/i.test(m[3])&&h===12)h=0;return[h,mi]}

function icsFor(items){const esc2=v=>String(v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);const fbx7Now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');const fbx7Day=d=>String(d).replace(/-/g,'');const fbx7Next=d=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+1);return x.toISOString().slice(0,10).replace(/-/g,'')};const ev=items.map(it=>`BEGIN:VEVENT\r\nUID:${it.uid}@gold-matchday\r\nDTSTAMP:${fbx7Now}\r\n${fbx7Hm(it.time)?`DTSTART;TZID=America/Los_Angeles:${icsStamp(it.date,it.time)}\r\nDTEND;TZID=America/Los_Angeles:${icsStamp(it.date,it.time,it.minutes||90)}`:`DTSTART;VALUE=DATE:${fbx7Day(it.date)}\r\nDTEND;VALUE=DATE:${fbx7Next(it.date)}`}\r\nSUMMARY:${esc2(it.title)}\r\n${it.where?'LOCATION:'+esc2(it.where)+'\r\n':''}${it.notes?'DESCRIPTION:'+esc2(it.notes)+'\r\n':''}END:VEVENT`).join('\r\n');const fbx7Tz='BEGIN:VTIMEZONE\r\nTZID:America/Los_Angeles\r\nBEGIN:DAYLIGHT\r\nTZOFFSETFROM:-0800\r\nTZOFFSETTO:-0700\r\nTZNAME:PDT\r\nDTSTART:19700308T020000\r\nRRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU\r\nEND:DAYLIGHT\r\nBEGIN:STANDARD\r\nTZOFFSETFROM:-0700\r\nTZOFFSETTO:-0800\r\nTZNAME:PST\r\nDTSTART:19701101T020000\r\nRRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU\r\nEND:STANDARD\r\nEND:VTIMEZONE\r\n';const fbx7Fold=t=>t.split('\r\n').map(l=>{let o='';while(l.length>74){o+=l.slice(0,74)+'\r\n ';l=l.slice(74)}return o+l}).join('\r\n');return fbx7Fold('BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Gold Matchday//EN\r\nCALSCALE:GREGORIAN\r\n'+fbx7Tz+ev+'\r\nEND:VCALENDAR')+'\r\n'}
function calendarItems(){const gs=goldMatches().filter(m=>m.status!=='postponed').map(m=>{const s=goldSide(m);return{uid:'g'+m.id,kind:'game',date:m.date,time:m.time,title:`${s.at==='home'?'vs':'at'} ${T(s.opp).short} (ECNL RL)`,where:m.venue||'',minutes:90,m}});

  return[...gs,...es].sort((a,b)=>(a.date+(parseTime(a.time)?String(parseTime(a.time)[0]).padStart(2,'0')+String(parseTime(a.time)[1]).padStart(2,'0'):'')).localeCompare(b.date+(parseTime(b.time)?String(parseTime(b.time)[0]).padStart(2,'0')+String(parseTime(b.time)[1]).padStart(2,'0'):'')))}

/* ---------- Games (kickoff times that lock predictions) ---------- */
function ptToMs(date,time){
  const [y,mo,d]=date.split('-').map(Number);let h=0,mi=0;
  const mt=/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i.exec(time||'');
  if(mt){h=+mt[1];mi=+mt[2];if(mt[3]&&/pm/i.test(mt[3])&&h<12)h+=12;if(mt[3]&&/am/i.test(mt[3])&&h===12)h=0}
  const want=Date.UTC(y,mo-1,d,h,mi);let guess=want+8*3600e3;
  const f=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  for(let i=0;i<2;i++){const p=Object.fromEntries(f.formatToParts(new Date(guess)).map(x=>[x.type,x.value]));const asUtc=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute);guess+=want-asUtc}
  return guess;
}

function authMsg(e){const c=(e&&e.code)||'';return ({'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account with that email — tap “Create an account”.','auth/email-already-in-use':'That email already has an account — sign in instead.','auth/weak-password':'Use at least 6 characters for the password.','auth/invalid-email':'That email doesn’t look right.','auth/popup-closed-by-user':'Sign-in window closed.','auth/unauthorized-domain':'This website isn’t allowed to sign in yet — tell Pablo (Firebase → Authentication → Settings → Authorized domains).','auth/too-many-requests':'Too many tries — wait a minute and try again.','auth/network-request-failed':'No connection — check your internet.'})[c]||('Something went wrong'+(c?' ('+c+')':'')+'.')}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-fbx],[data-fbx-approve],[data-fbx-decline],[data-fbx-del],[data-fbx-send]');if(!t)return;

    if(t.dataset.fbxApprove){await updateDoc(doc(db,'members',t.dataset.fbxApprove),{status:'approved'});toast('Approved ✓');return}

let chatEl=null;
const seenKey='gold.fbxChatSeen';
function listenChat(){
  stop('chat');

function closeChat(){if(chatEl){chatEl.remove();chatEl=null;try{localStorage.setItem(seenKey,String(Date.now()))}catch(e){}updateDot()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sheet)closeSheet();else if(chatEl)closeChat()}});
function renderChat(jump){
  if(!chatEl)return;const box=chatEl.querySelector('#fbx-msgs');const atBottom=jump||box.scrollHeight-box.scrollTop-box.clientHeight<80;

<script id="fbx3-rows">
(function(){
  const SLACK=1; // Oct 18 v7: no overlap tolerated (was 6px)
  function collides(row){
    const score=row.querySelector('.score');if(!score)return false;let sr=score.getBoundingClientRect();try{const rg=document.createRange();rg.selectNodeContents(score);const g=rg.getBoundingClientRect();if(g.width)sr=g}catch(e){}let hit=false;
    row.querySelectorAll('.team').forEach(t=>{const sp=[...t.children].find(e=>e.tagName==='SPAN'&&!e.classList.contains('crest'));if(!sp)return;
      const r=sp.getBoundingClientRect();if(!r.width)return;const textRight=r.left+sp.scrollWidth;
      if(sp.scrollWidth>sp.clientWidth+0.5)hit=true; // a word wider than its own space
      if(t.classList.contains('r')){const c=t.querySelector('.crest');if(c&&textRight>c.getBoundingClientRect().left+SLACK)hit=true}
      else if(textRight>sr.left+SLACK)hit=true});
    return hit;
  }
  function check(){
    // v7: step 1 borrows the empty space around the score (same sizes); step 2 smaller text; step 3 stack.
    const rows=[...document.querySelectorAll('#main .row')].filter(r=>!r.classList.contains('fbx3-room'));
    const a=rows.filter(collides);a.forEach(r=>r.classList.add('fbx3-room'));
    const b=a.filter(collides);b.forEach(r=>r.classList.add('fbx3-tight'));
    b.filter(collides).forEach(r=>r.classList.add('fbx3-tight2'));
  }
  const main=document.getElementById('main');if(!main)return;
  new MutationObserver(()=>check()).observe(main,{childList:true});
  function recheck(){main.querySelectorAll('.row.fbx3-room').forEach(r=>r.classList.remove('fbx3-room','fbx3-tight','fbx3-tight2'));check()}
  let t;window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(recheck,150)});
  // v7: measure again once the real fonts have loaded (the stand-in font is wider)
  if(document.fonts){if(document.fonts.ready)document.fonts.ready.then(recheck);document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>{clearTimeout(t);t=setTimeout(recheck,50)})}
  check();
})();
</script>

<script type="module" id="fbx2-families">
/* Families add-on (Oct 18 2026): who's coming (Going / Maybe / Not going per player, for practices and games)
   and family contacts on the roster. Only approved team members can see or use any of it.
   Firestore: members/{uid}.players (which kids are mine), rsvps/{item}_{num}, families/{id}. Rules v2. */
import {getApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,doc,collection,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,serverTimestamp,getDocs,getDoc,query,where} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const G=window.GoldFB;if(!G||G.stub){console.warn('fbx2: Firebase layer not ready');}
const db=getFirestore(getApp());
const app=()=>window.GoldApp;
const fx=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{try{app().toast(m)}catch(e){}};
const LABEL={going:'Going',maybe:'Maybe',no:'Not going'};
const roster=()=>{try{return app().roster()||[]}catch(e){return []}};
function pn(p){const f=String(p.first||'').trim().replace(/\s+/g,' ');const first=f.split(' ')[0]||'';const last=String(p.last||'').trim();const li=(last.match(/[A-Za-zÀ-ÿ]/)||[''])[0].toUpperCase();return `${fx(first.charAt(0).toUpperCase()+first.slice(1))}${li?' '+li+'.':''}`}
const byNum=n=>roster().find(p=>p.num===n);
const myName=()=>(G.member&&G.member.name)||(G.user&&(G.user.displayName||(G.user.email||'').split('@')[0]))||'Team member';
const myPlayers=()=>(G.isApproved&&G.member&&Array.isArray(G.member.players)?G.member.players.map(Number).filter(n=>byNum(n)):[]);

let rsvps=[],families=[],famRaw=[],approvedUids=new Set();let unsub={};
function stop(k){if(unsub[k]){try{unsub[k]()}catch(e){}delete unsub[k]}}
/* fbx6 (Oct 18 2026): live-data updates redraw quietly — no page entrance animation, bursts merged into one redraw,
   scroll kept. Tab switches still animate. */
let fbx6Quiet=false,fbx6Q=null,fbx6T=null;
function fbx6Hush(){fbx6Quiet=true;clearTimeout(fbx6Q);fbx6Q=setTimeout(()=>{fbx6Quiet=false},0)}

window.addEventListener('fbx-change',fbx6Hush,true);

function fbx6Redraw(){const A=app();if(!A)return;const a=document.activeElement;if(a&&document.getElementById('main')&&document.getElementById('main').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;const y=window.scrollY;fbx6Hush();A.render();window.scrollTo({top:y,behavior:'instant'})}

/* ---------- live switch: follows approval ---------- */
let wasOn=false;
function sync(){
  const on=!!(G&&G.isApproved);const A=app();
  if(A)A.state.live=on;
  if(on&&!wasOn){listen()}
  if(!on&&wasOn){['rsvps','families','fmembers'].forEach(stop);rsvps=[];families=[];famRaw=[];approvedUids=new Set()}

  stop('rsvps');unsub.rsvps=onSnapshot(collection(db,'rsvps'),s=>{const l=[];s.forEach(d=>{const x=d.data();if(x&&x.item&&x.num!=null&&LABEL[x.status])l.push({id:d.id,...x,num:+x.num})});rsvps=l;rerender()},e=>console.warn('fbx2 rsvps',e));
  stop('families');unsub.families=onSnapshot(collection(db,'families'),s=>{const l=[];s.forEach(d=>l.push({id:d.id,...d.data()}));l.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));famRaw=l;refreshFamilies()},e=>console.warn('fbx2 families',e));
  stop('fmembers');unsub.fmembers=onSnapshot(query(collection(db,'members'),where('status','==','approved')),s=>{const a=new Set();s.forEach(d=>{const m=d.data();if(m&&(m.status==='approved'||m.role==='admin'))a.add(d.id)});approvedUids=a;refreshFamilies()},e=>console.warn('fbx2 members',e));

window.availabilityPanel=function(item,past){
  const r=window.rsvpFor(item);const total=roster().length||1;const seg=k=>Math.round(r.counts[k]/total*100);const staff=!!G.isStaff&&!past;
  const mark=(p,cur)=>staff?`<span class="fbx2-staffmark" title="Mark for this player (staff)">${[['going','✓'],['maybe','?'],['no','✕']].map(([st,ic])=>`<button class="${st} ${cur&&cur.status===st?'on':''}" data-rsvp="${fx(item)}:${p.num}:${st}" aria-label="${LABEL[st]} for ${pn(p)}">${ic}</button>`).join('')}</span>`:'';

  const list=st=>{const rows=r.rows.filter(x=>x.status===st).map(x=>({p:byNum(x.num),by:x.name})).filter(x=>x.p).sort((a,b)=>a.p.num-b.p.num);return `<div class="av-group ${st}"><div class="av-group-h"><span class="av-dot"></span><b>${LABEL[st]}</b><span class="av-count">${rows.length}</span></div>${rows.length?`<div class="av-list">${rows.map(({p,by})=>row(p,by)).join('')}</div>`:'<div class="av-empty">Nobody yet</div>'}</div>`};
  const missing=`<div class="av-group missing"><div class="av-group-h"><span class="av-dot"></span><b>Haven’t replied</b><span class="av-count">${r.missing.length}</span></div>${r.missing.length?`<div class="av-list">${r.missing.slice().sort((a,b)=>a.num-b.num).map(p=>row(p,'')).join('')}</div>`:'<div class="av-empty">Everyone has answered 🎉</div>'}</div>`;

async function setRsvp(item,num,status){
  if(!G.isApproved){G.openAccount();return}
  const p=byNum(num);if(!p)return;
  if(!G.isStaff&&!myPlayers().includes(num)){if(fbx7PlayersLocked()){toast('You answer for your own player — ask Pablo or a team manager to change it');return}toast('Pick your player first');openPick();return}
  const id=item+'_'+num;const cur=rsvps.find(r=>r.id===id);
  try{
    if(cur&&cur.status===status){await deleteDoc(doc(db,'rsvps',id));toast('Answer cleared')}
    else{await setDoc(doc(db,'rsvps',id),{item,num,status,uid:G.uid,name:myName(),t:serverTimestamp()});toast(`${pn(p)}: ${LABEL[status]}`)}

   After sign-in (Google or email) a parent must finish registration before using member features:
   their name, role, phone, their player(s) (or "my player isn't listed"), optional second parent.
   Saved to members/{uid} (+registered) and families/{email or uid}, families/{uid}_2. Then wait for approval. */
const ROLES=['Mom','Dad','Guardian','Other'];
const emailKey=()=>{const e=String((G.user&&G.user.email)||'').trim().toLowerCase();return e&&G.user.emailVerified&&!e.includes('/')?e:''};
const needsReg=()=>!!(G.ready&&G.user&&!(G.member&&G.member.registered===true));

async function loadDraft(){
  const d={name:'',role:'',phone:'',email:(G.user&&G.user.email)||'',players:[],newPlayer:'',newNum:'',c2:{name:'',role:'',phone:'',email:''},fromList:false,staff:false};
  const m=G.member||{};
  d.name=m.name||(G.user&&G.user.displayName)||'';d.phone=m.phone||'';d.players=Array.isArray(m.players)?m.players.map(Number):[];
  if(m.newPlayer){const mm=/^(.*?)(?:\s*#(\d+))?$/.exec(m.newPlayer);d.newPlayer=mm[1]||'';d.newNum=mm[2]||''}
  const tryGet=async id=>{try{const s=await getDoc(doc(db,'families',id));return s.exists()?s.data():null}catch(e){return null}};
  const ek=emailKey();const own=(ek&&await tryGet(ek))||await tryGet(G.uid);
  if(own){d.name=d.name||own.name||'';d.role=own.role||'';d.phone=d.phone||own.phone||'';if(!d.players.length)d.players=(own.players||[]).map(Number);d.fromList=!own.uid}
  const c2=await tryGet(G.uid+'_2');if(c2)d.c2={name:c2.name||'',role:c2.role||'',phone:c2.phone||'',email:c2.email||''};
  if(/coach|staff/i.test(d.role)||/^Coach \/ staff/.test(m.playerName||'')){d.staff=true}
  if(d.role&&!ROLES.includes(d.role))d.role=/mom|mother/i.test(d.role)?'Mom':/dad|father/i.test(d.role)?'Dad':/guard/i.test(d.role)?'Guardian':'Other';
  return d;
}

/* fbx8 (Oct 18 2026): after the email link is tapped, refresh the sign-in pass so the database sees "verified" right away */
async function fbx8FreshToken(){try{if(G.user&&G.user.emailVerified&&G.user.getIdTokenResult){const t=await G.user.getIdTokenResult();if(!(t&&t.claims&&t.claims.email_verified))await G.user.getIdToken(true)}}catch(e){}}

function fbx7NeedsVerify(){return !!(G.user&&!G.user.emailVerified&&!G.isOwner)}
function fbx7PlayersLocked(){return !!(G.member&&G.member.status==='approved'&&!G.isOwner&&Array.isArray(G.member.players)&&G.member.players.length>0)}
function paintVerify(msg){if(!regEl)return;regEl.innerHTML=`<div class="fbx-sheet fbx5-sheet" role="dialog" aria-modal="true" aria-label="Verify your email"><div class="fbx-sheet-h"><h3>Check your email</h3></div><p class="small fg2">We sent a link to <b>${fx((G.user&&G.user.email)||'')}</b>. Tap it to confirm the address is yours, then come back and tap the button below.</p><div class="fbx-row"><button class="btn gold" data-fbx7="verified">I’ve tapped the link</button><button class="btn ghost" data-fbx7="resend">Send the link again</button></div><p class="fbx-err" role="alert">${fx(msg||'')}</p><p class="small muted" style="margin:10px 0 0">Tip: signing in with Google skips this step. · <button class="fbx-link" data-fbx5="signout">Sign out</button></p></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-fbx7]');if(!b)return;e.preventDefault();e.stopPropagation();
  if(b.dataset.fbx7==='resend'){try{await sendEmailVerification(G.user);paintVerify('Sent — check your inbox (and spam).')}catch(err){paintVerify('Couldn’t send right now — wait a minute and try again.')}}
  if(b.dataset.fbx7==='verified'){try{await G.user.reload();await G.user.getIdToken(true)}catch(err){}if(G.user.emailVerified){regDraft=await loadDraft();paintReg()}else paintVerify('Not confirmed yet — tap the link in the email first.')}},true);
function paintReg(err){if(!regEl)return;regEl.innerHTML=regHTML(regEdit,err);regEl.querySelectorAll('.fbx5-pick input').forEach(i=>i.addEventListener('change',()=>i.closest('label').classList.toggle('on',i.checked)))}
function closeReg(){if(regEl){regEl.remove();regEl=null;document.body.classList.remove('fbx5-on')}}
async function saveReg(){
  readForm();const d=regDraft;
  const digits=s=>String(s||'').replace(/\D/g,'');
  if(!d.name)return paintReg('Please type your name.');
  if(!d.role&&!d.staff)return paintReg('Please choose Mom, Dad, Guardian or Other.');
  if(digits(d.phone).length<10)return paintReg('Please add a phone number other families can reach you at.');
  if(!d.players.length&&!d.newPlayer&&!d.staff)return paintReg('Pick your player, or add them under “My player isn’t on the list” — or tick “I’m a coach or team staff”.');
  if(d.c2.name&&!d.c2.phone&&!d.c2.email)return paintReg('Add a phone or email for the second parent (or clear their name).');
  if(d.players.length>6)return paintReg('Pick up to 6 players.');
  regBusy=true;paintReg();await fbx8FreshToken();
  const newPlayer=d.newPlayer?(d.newPlayer.slice(0,40)+(digits(d.newNum)?' #'+digits(d.newNum).slice(0,3):'')):'';
  const summary=[d.staff?'Coach / staff':'',...d.players.map(n=>{const p=byNum(n);return p?`#${n} ${pn(p).replace(/&[^;]+;/g,'')}`:'#'+n}),newPlayer?'NEW: '+newPlayer:''].filter(Boolean).join(', ').slice(0,120);
  try{
    const mref=doc(db,'members',G.uid);
    if(!G.member){await setDoc(mref,{name:d.name.slice(0,60),email:G.user.email||'',role:'member',status:'pending',playerName:summary,photoURL:G.user.photoURL||'',createdAt:serverTimestamp(),players:d.players,phone:d.phone.slice(0,30),newPlayer,registered:true})}
    else{await updateDoc(mref,{name:d.name.slice(0,60),playerName:summary,players:d.players,phone:d.phone.slice(0,30),newPlayer,registered:true})}
    const base={uid:G.uid,players:d.players,updatedAt:serverTimestamp(),by:d.name.slice(0,60)};
    const ek=emailKey();
    await setDoc(doc(db,'families',ek||G.uid),{...base,name:d.name.slice(0,60),role:(d.staff&&!d.role?'Coach / staff':d.role).slice(0,40),email:(G.user.email||'').slice(0,80),phone:d.phone.slice(0,30)});
    if(ek){try{await deleteDoc(doc(db,'families',G.uid))}catch(e){}}
    const c2ref=doc(db,'families',G.uid+'_2');
    if(d.c2.name)await setDoc(c2ref,{...base,name:d.c2.name.slice(0,60),role:d.c2.role||'',email:d.c2.email.slice(0,80),phone:d.c2.phone.slice(0,30)});
    else{try{await deleteDoc(c2ref)}catch(e){}}
    regBusy=false;const wasEdit=regEdit;closeReg();const fc=document.querySelector('.fbx-overlay:not(.fbx5-overlay) [data-fbx="close"]');if(fc)fc.click();
    toast(wasEdit?'Saved ✓':(G.isApproved?'You’re all set ✓':'Thanks! Pablo or a manager will approve you soon'));
  }catch(e){regBusy=false;console.warn('fbx5 save',e);paintReg('Couldn’t save — check your connection and try again.')}
}
function checkReg(){
  if(needsReg()){if(!regEl)openReg(false)}
  else if(regEl&&!regEdit)closeReg();
  if(!G.user&&regEl)closeReg();
}
window.addEventListener('fbx-change',()=>setTimeout(checkReg,30));

/* ---------- tap a player → family contacts sheet ---------- */
let famSheet=null;
function openFam(num){
  const p=byNum(+num);if(!p)return;
  if(!famSheet){const el=document.createElement('div');el.className='fbx-overlay fbx5-overlay';el.addEventListener('click',e=>{if(e.target===el)closeFam()});document.body.appendChild(el);famSheet={el,num:+num}}
  famSheet.num=+num;
  let body;
  if(!G.user)body=`<p class="small fg2" style="margin:0 0 12px">Family contacts are for team families. Sign in and register — once Pablo or a manager approves you, you can reach every family from here.</p><button class="btn gold wide" data-fbx5="signin">Sign in or join</button>`;
  else if(needsReg())body=`<p class="small fg2" style="margin:0 0 12px">Finish registering first, then you’ll see family contacts once you’re approved.</p><button class="btn gold wide" data-fbx5="reg">Finish registering</button>`;
  else if(!G.isApproved)body=`<p class="small fg2" style="margin:0">You’re registered ✓ Waiting for Pablo or a team manager to approve you — family contacts open up as soon as they do.</p>`;
  else{const fs=famOf(p.num);const mine=myPlayers().includes(p.num);
    body=fs.length?`<div class="fbx5-contacts">${fs.map(f=>`<div class="fbx5-c"><div class="fbx5-c-h"><b>${fx(f.name||'')}</b>${f.role?`<i>${fx(f.role)}</i>`:''}</div><div class="fbx5-c-a">${f.phone?`<a class="btn ghost sm" href="tel:${fx(tel(f.phone))}">📞 ${fx(f.phone)}</a><a class="btn ghost sm" href="sms:${fx(tel(f.phone))}">💬 Text</a>`:''}${f.email?`<a class="btn ghost sm" href="mailto:${fx(f.email)}">✉️ Email</a>`:''}</div></div>`).join('')}</div>`
      :`<p class="small fg2" style="margin:0">No family has registered for ${pn(p)} yet.</p>`;
    if(mine)body+=`<button class="btn quiet sm" data-fbx5="reg-edit" style="margin-top:10px">Edit my family info</button>`;}
  famSheet.el.innerHTML=`<div class="fbx-sheet fbx5-sheet" role="dialog" aria-modal="true" aria-label="Family of ${fx(p.first||'')}"><div class="fbx-sheet-h"><h3><span class="fbx5-num">${p.num}</span> ${pn(p)}</h3><button class="fbx-x" data-fbx5="fam-close" aria-label="Close">×</button></div><div class="fbx5-sec" style="margin-top:0">Family contacts</div>${body}</div>`;
}
function closeFam(){if(famSheet){famSheet.el.remove();famSheet=null}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(famSheet)closeFam();else if(regEl&&regEdit)closeReg()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-fbx5-fam]')){e.preventDefault();e.stopPropagation();openFam(e.target.closest('[data-fbx5-fam]').dataset.fbx5Fam)}},true);

document.addEventListener('click',async e=>{
  const fam=e.target.closest('[data-fbx5-fam]');if(fam){e.preventDefault();e.stopPropagation();openFam(fam.dataset.fbx5Fam);return}
  // signed in but not registered: "Finish joining" / "Ask to join" go to the registration page instead
  const acct=e.target.closest('[data-fbx="account"],[data-fbx="join"]');if(acct&&needsReg()){e.preventDefault();e.stopImmediatePropagation();openReg(false);return}
  const b=e.target.closest('[data-fbx5]');if(!b)return;const a=b.dataset.fbx5;
  if(a==='save'){e.preventDefault();saveReg()}
  else if(a==='close')closeReg();
  else if(a==='fam-close')closeFam();
  else if(a==='signin'){closeFam();G.openAccount()}
  else if(a==='reg'){closeFam();openReg(false)}
  else if(a==='reg-edit'){closeFam();openReg(true)}
  else if(a==='signout'){closeReg();if(G.signOutAll)G.signOutAll()}
},true);
G.fbx5={openReg,openFam,needsReg};

G.fbx2={rsvps:()=>rsvps,families:()=>families,myPlayers,openPick};
sync();
</script>

</body></html>
